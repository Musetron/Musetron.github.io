<!DOCTYPE html>
<html lang="de">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
@charset "utf-8";
html, body {
  margin: 0px;
  padding: 0px;
  width: 100%;
  height: 100%;
  background-color: rgb(18, 18, 18);
  color: rgb(170, 170, 170);
  font-family: Arial, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 {
  font-size: 2em;
  color: rgb(170, 170, 170);
  margin: 0px;
  text-align: center;
}
.pedal-container {
  display: flex;
  justify-content: space-between;
  width: 400px;
  margin-top: 40px;
}
.slider-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}
input[type="range"].vertical {
  appearance: slider-vertical;
  width: 40px;
  height: 150px;
  background: rgb(51, 51, 51);
  border-radius: 10px;
  accent-color: rgb(170, 170, 170);
  cursor: grab;
  margin-bottom: 10px;
}
label {
  color: rgb(170, 170, 170);
}
.tacho-container {
  width: 400px;
  height: 200px;
  position: relative;
  margin-top: 20px;
}
.tacho-bg {
  position: absolute;
  bottom: 0px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: auto;
  z-index: 1;
}
.tacho {
  position: absolute;
  bottom: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
#needle {
  stroke: rgb(255, 0, 0);
}
#needle circle {
  fill: rgb(255, 0, 0);
}
#unlockAudio {
  position: fixed;
  inset: 0px;
  background: rgb(0, 0, 0);
  color: white;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  cursor: pointer;
}
</style>
<title>Racing Car</title>
</head>
<body>
<div id="unlockAudio">Start</div>
<h1>Racing Car</h1>
<div class="tacho-container">
    <img src="https://i.ibb.co/7dc4fnhT/speedometer-PNG36.png" alt="Tacho" class="tacho-bg">
    <svg class="tacho" viewBox="0 0 400 200">
        <line id="needle" x1="200" y1="200" x2="200" y2="40" stroke="#ff0000" stroke-width="6" stroke-linecap="round" transform="rotate(-90 200 200)"></line>
        <circle cx="200" cy="200" r="8" fill="#ff0000"></circle>
    </svg>
</div>
<div class="pedal-container" id="sliderUI">
    <div class="slider-container">
        <input type="range" id="brakeSlider" class="vertical" min="0" max="1" step="0.001" value="0">
        <label>Brake</label>
    </div>
    <div class="slider-container">
        <input type="range" id="gasSlider" class="vertical" min="0" max="1" step="0.001" value="0">
        <label>Gas</label>
    </div>
</div>

<script>
  let audioCtx = null;
  let engineOscillator = null;
  let engineGain = null;

  // Start-Button für Audio-Kontext & Sensoren
  document.getElementById('unlockAudio').addEventListener('click', () => {
    initAudio();
    initMotionSensors();
    document.getElementById('unlockAudio').style.display = 'none';
  });

  function initAudio() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Motorensound-Oszillator erstellen (Sägezahn klingt nach Motor)
      engineOscillator = audioCtx.createOscillator();
      engineOscillator.type = 'sawtooth';
      engineOscillator.frequency.setValueAtTime(60, audioCtx.currentTime);

      engineGain = audioCtx.createGain();
      engineGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

      engineOscillator.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      engineOscillator.start();
    } catch(e) {
      console.log("Audio konnte nicht gestartet werden", e);
    }
  }

  function initMotionSensors() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(response => {
        if (response === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
        }
      }).catch(console.error);
    } else {
      window.addEventListener('devicemotion', handleMotion);
    }
  }

  let smoothedGas = 0;
  let smoothedBrake = 0;

  function handleMotion(event) {
    let beta = event.accelerationIncludingGravity ? event.accelerationIncludingGravity.y : 0;
    
    let targetGas = 0;
    let targetBrake = 0;

    // Filter-Logik fürs Laufen / Neigen
    if (beta > 2.0) {
      targetGas = Math.min((beta - 2.0) / 7.0, 1.0);
    } else if (beta < -2.0) {
      targetBrake = Math.min((Math.abs(beta) - 2.0) / 7.0, 1.0);
    }

    // Sanfte Glättung gegen das Herumspringen
    smoothedGas += (targetGas - smoothedGas) * 0.3;
    smoothedBrake += (targetBrake - smoothedBrake) * 0.3;

    const gasSlider = document.getElementById('gasSlider');
    const brakeSlider = document.getElementById('brakeSlider');

    gasSlider.value = smoothedGas;
    brakeSlider.value = smoothedBrake;

    gasSlider.dispatchEvent(new Event('input'));
    brakeSlider.dispatchEvent(new Event('input'));

    // Tachonadel aktualisieren
    updateTacho(smoothedGas - smoothedBrake);

    // Motorsound anpassen
    updateEngineSound(smoothedGas, smoothedBrake);
  }

  function updateTacho(value) {
    const needle = document.getElementById('needle');
    if (needle) {
      let angle = -90 + (value * 90); 
      needle.setAttribute('transform', `rotate(${angle} 200 200)`);
    }
  }

  function updateEngineSound(gas, brake) {
    if (!audioCtx || !engineOscillator) return;
    
    // Frequenz steigt mit Gas, sinkt bei Bremse
    let baseFreq = 50 + (gas * 250) - (brake * 30);
    if (baseFreq < 40) baseFreq = 40;
    
    engineOscillator.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.05);
  }
</script>
</body>
</html>
