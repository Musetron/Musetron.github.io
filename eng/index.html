<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Car Pedal Audio Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-color: #f0f2f5;
            overflow: hidden;
            padding-bottom: 30px;
            user-select: none;
        }

        .slider-vertical {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            width: 200px;
        }

        .slider-left { left: -60px; }
        .slider-right { right: -60px; }

        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .slider-horizontal { width: 100%; }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s;
        }

        .btn.active {
            background-color: #003d7a;
            transform: scale(0.98);
        }

        #motorStatus {
            position: absolute;
            top: 20px;
            font-weight: bold;
            color: #555;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="motorStatus">Motor: AUS<br>(Beliebige Taste drücken zum Laden, ENTER zum Starten)</div>

    <input type="range" id="sliderLeft" class="slider-vertical slider-left" min="0" max="100" value="0">
    <input type="range" id="sliderRight" class="slider-vertical slider-right" min="0" max="100" value="0">

    <div class="bottom-controls">
        <input type="range" id="sliderCenter" class="slider-horizontal" min="0" max="100" value="50">
        <button id="myButton" class="btn">Klick mich</button>
    </div>

    <script>
        // --- UI & Slider ---
        const sLeft = document.getElementById('sliderLeft');
        const sRight = document.getElementById('sliderRight');
        const sCenter = document.getElementById('sliderCenter');
        const btn = document.getElementById('myButton');
        const statusText = document.getElementById('motorStatus');

        let targetCenter = 50, currentCenter = 50;
        
        // Physikalische Variablen für echte Fahrzeugdynamik
        let vehicleSpeed = 0;   // Tatsächliche Geschwindigkeit des Autos (0 - 100)
        let engineRPM = 0;      // Motordrehzahl (0 - 100)
        
        const maxSpeed = 100;
        const acceleration = 0.8;  // Wie schnell das Auto beschleunigt (W)
        const brakingPower = 2.5;  // Wie stark die Bremse greift (S)
        const rollFriction = 0.2;  // Natürlicher Geschwindigkeitsverlust ohne Gas
        const engineResponse = 0.25; // Wie schnell die Drehzahl dem Gaspedal folgt
        
        const keys = { w: false, s: false };

        window.addEventListener('mousemove', (e) => { targetCenter = (e.clientX / window.innerWidth) * 100; });
        
        // --- Web Audio API ---
        let audioCtx = null;
        let audioBuffers = {};
        
        let idleGainNode = null;
        let driveGainNode = null;
        let bgGainNode = null;
        
        let activeSources = { start: null, idle: null, drive: null, bg: null };
        let motorRunning = false;
        let isBraking = false;
        let hasLaunched = false; 
        let lastRPM = 0;
        let soundsLoaded = false;

        const soundFiles = {
            start: 'start.wav',
            bg: 'background.wav',
            idle: 'idle1.wav',
            drive: 'drive.wav',
            stop: 'stop.wav',
            pop: 'pop.wav'
        };

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            await loadSounds();
        }

        async function loadSounds() {
            statusText.innerHTML = "Lade Sounds...";
            for (let name in soundFiles) {
                try {
                    const response = await fetch(soundFiles[name]);
                    const arrayBuffer = await response.arrayBuffer();
                    audioBuffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.error("Fehler beim Laden von " + soundFiles[name], e);
                }
            }
            soundsLoaded = true;
            statusText.innerHTML = "Sounds bereit!<br>(ENTER drücken zum Starten)";
        }

        function playSound(buffer, loop = false, gainNode = null) {
            if (!buffer || !audioCtx) return null;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = loop;
            
            const destination = gainNode || audioCtx.destination;
            source.connect(destination);
            source.start(0);
            return source;
        }

        // --- Auspuff Knallen (Pops & Bangs) ---
        function triggerExhaustPop(volume) {
            if (!motorRunning || !audioBuffers['pop'] || !audioCtx) return;
            
            const popGain = audioCtx.createGain();
            popGain.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
            popGain.connect(audioCtx.destination);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers['pop'];
            source.playbackRate.setValueAtTime(0.8 + Math.random() * 0.4, audioCtx.currentTime);
            source.connect(popGain);
            source.start(0);
        }

        // Schleife prüft permanent auf plötzlichen Drehzahl-Abfall (Gas wegnehmen)
        setInterval(() => {
            if (!motorRunning) return;

            if (lastRPM > 30 && engineRPM < lastRPM - 3) {
                if (Math.random() < 0.45) { // 45% Chance bei dynamischem Lastwechsel
                    let intensity = Math.min(1, (lastRPM - engineRPM) / 30) * (0.4 + Math.random() * 0.6);
                    triggerExhaustPop(intensity);
                }
            } else if (engineRPM < 10 && Math.random() < 0.03) {
                triggerExhaustPop(0.08 + Math.random() * 0.1); // Dezentes Blubbern im Leerlauf
            }
            lastRPM = engineRPM;
        }, 100);

        // --- Motor Start ---
        function startMotor() {
            if (motorRunning || !soundsLoaded) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            motorRunning = true;
            statusText.innerHTML = "Motor: STARTET...";

            const startBuf = audioBuffers['start'];
            activeSources.start = playSound(startBuf, false);

            if (startBuf) {
                const halfDuration = startBuf.duration / 2;

                setTimeout(() => {
                    if (!motorRunning) return;

                    idleGainNode = audioCtx.createGain();
                    driveGainNode = audioCtx.createGain();
                    bgGainNode = audioCtx.createGain();
                    
                    idleGainNode.connect(audioCtx.destination);
                    driveGainNode.connect(audioCtx.destination);
                    bgGainNode.connect(audioCtx.destination);

                    idleGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    driveGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    bgGainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                    activeSources.idle = playSound(audioBuffers['idle'], true, idleGainNode);
                    activeSources.drive = playSound(audioBuffers['drive'], true, driveGainNode);
                    activeSources.bg = playSound(audioBuffers['bg'], true, bgGainNode);

                }, halfDuration * 1000);
            }
        }

        // --- Motor Stopp ---
        function stopMotor() {
            if (!motorRunning) return;
            motorRunning = false;
            statusText.innerHTML = "Motor: SCHALTET AUS...";

            if (activeSources.start) { try { activeSources.start.stop(); } catch(e){} }

            const stopBuf = audioBuffers['stop'];
            playSound(stopBuf, false);

            if (stopBuf) {
                const fadeTime = 0.4;
                const now = audioCtx.currentTime;

                if (idleGainNode) idleGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                if (driveGainNode) driveGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                if (bgGainNode) bgGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);

                setTimeout(() => {
                    if (motorRunning) return;
                    if (activeSources.idle) { try{activeSources.idle.stop();}catch(e){} }
                    if (activeSources.drive) { try{activeSources.drive.stop();}catch(e){} }
                    if (activeSources.bg) { try{activeSources.bg.stop();}catch(e){} }
                    statusText.innerHTML = "Motor: AUS<br>(ENTER drücken zum Starten)";
                }, fadeTime * 1000);
            }
        }

        // --- Tasten-Abfragen ---
        window.addEventListener('keydown', async (e) => {
            if (!audioCtx) { await initAudio(); }

            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true; // Gas
            if (key === 's') keys.s = true; // Bremse
            
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                btn.classList.add('active');
                btn.click();
            }

            if (e.key === 'Enter') startMotor();
            if (e.key === 'Backspace' || e.key === 'Delete') stopMotor();
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 's') keys.s = false;
            if (e.key === ' ' || e.code === 'Space') btn.classList.remove('active');
        });

        // --- Physik & Real-Pedal Audio Mix Loop ---
        function updatePhysics() {
            currentCenter += (targetCenter - currentCenter) * friction;
            sCenter.value = currentCenter;

            // --- 1. ECHTE PEDAL-PHYSIK ---
            let targetRPM = 0;

            if (motorRunning) {
                if (keys.s && vehicleSpeed > 0) {
                    // BREMSEN: S wird gedrückt während das Fahrzeug rollt
                    vehicleSpeed = Math.max(0, vehicleSpeed - brakingPower);
                    targetRPM = vehicleSpeed * 0.3; // Drehzahl sackt beim Bremsen stark ab
                    
                    if (!isBraking) {
                        isBraking = true;
                        playSound(audioBuffers['stop'], false); // Bremsgeräusch einmalig zünden
                    }
                } else {
                    isBraking = false;

                    if (keys.w) {
                        // GAS GEBEN: W beschleunigt das Auto
                        vehicleSpeed = Math.min(maxSpeed, vehicleSpeed + acceleration);
                        targetRPM = vehicleSpeed * 0.8 + 20; // Höheres Gas = Höhere Drehzahl
                    } else {
                        // AUSROLLEN: Kein Pedal gedrückt
                        vehicleSpeed = Math.max(0, vehicleSpeed - rollFriction);
                        targetRPM = vehicleSpeed * 0.5; 
                    }
                }
                
                // Drehzahl folgt dem Gaspedal/Zustand verzögert (Trägheit des Motors)
                engineRPM += (targetRPM - engineRPM) * engineResponse;
            } else {
                vehicleSpeed = 0;
                engineRPM = 0;
            }

            // Slider-Anzeigen spiegeln nun die Physik wider:
            // Linker Slider = Bremsdruck / Rechter Slider = Fahrzeug-Geschwindigkeit (Tachometer)
            sLeft.value = keys.s ? 100 : 0;
            sRight.value = vehicleSpeed;

            // --- 2. DYNAMISCHE AUDIO STEUERUNG ---
            if (motorRunning && idleGainNode && driveGainNode) {
                const now = audioCtx.currentTime;
                const transitionSpeed = 0.08; // Extrem smoothe Überblendzeit (80ms)

                // Losfahr-Effekt (Trigger beim ersten echten Beschleunigen aus dem Stand)
                if (vehicleSpeed > 5 && !hasLaunched) {
                    hasLaunched = true;
                    playSound(audioBuffers['stop'], false); // Spielt stop.wav als Einsetz-Kicker
                } else if (vehicleSpeed <= 2) {
                    hasLaunched = false;
                }

                // UI Status Update
                if (isBraking) {
                    statusText.innerHTML = `Motor: BREMST!<br>Speed: ${Math.round(vehicleSpeed)} km/h | RPM: ${Math.round(engineRPM)}`;
                } else if (vehicleSpeed > 5) {
                    statusText.innerHTML = `Motor: FAHRT (${engineRPM > 60 ? 'Vollgas' : 'Beschleunigt'})<br>Speed: ${Math.round(vehicleSpeed)} km/h | RPM: ${Math.round(engineRPM)}`;
                } else {
                    statusText.innerHTML = `Motor: LEERLAUF<br>Speed: 0 km/h | RPM: ${Math.round(engineRPM)}`;
                }

                // ECHTER CROSSFADE basierend auf der Motordrehzahl (engineRPM 0 - 100)
                let targetIdle = 1;
                let targetDrive = 0;

                if (engineRPM <= 50) {
                    // 0% bis 50% Drehzahl: Leerlauf bleibt dominant, drive.wav fängt an reinzufaden
                    targetIdle = 1;
                    targetDrive = engineRPM / 50;
                } else {
                    // Über 50% Drehzahl: idle1.wav verschwindet komplett, drive.wav dröhnt voll
                    targetIdle = 1 - ((engineRPM - 50) / 50);
                    targetDrive = 1;
                }

                // Wenn man voll auf der Bremse steht, Sounds stark dämpfen
                if (isBraking) {
                    targetIdle = 0.4;
                    targetDrive = 0.0;
                }

                // Werte knackfrei übergeben
                idleGainNode.gain.linearRampToValueAtTime(targetIdle, now + transitionSpeed);
                driveGainNode.gain.linearRampToValueAtTime(targetDrive, now + transitionSpeed);
                
                // Realistische Tonhöhenverschiebung (Pitch) gekoppelt an die Drehzahl
                if (activeSources.idle) {
                    activeSources.idle.playbackRate.setValueAtTime(0.9 + (engineRPM / 200), now);
                }
                if (activeSources.drive) {
                    activeSources.drive.playbackRate.setValueAtTime(0.8 + (engineRPM / 110), now);
                }
            }

            requestAnimationFrame(updatePhysics);
        }
        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
