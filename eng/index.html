<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Layout mit Audio Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-color: #f0f2f5;
            overflow: hidden;
            padding-bottom: 30px;
            user-select: none;
        }

        .slider-vertical {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            width: 200px;
        }

        .slider-left { left: -60px; }
        .slider-right { right: -60px; }

        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .slider-horizontal { width: 100%; }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s;
        }

        .btn.active {
            background-color: #003d7a;
            transform: scale(0.98);
        }

        #motorStatus {
            position: absolute;
            top: 20px;
            font-weight: bold;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="motorStatus">Motor: AUS (Enter drücken)</div>

    <input type="range" id="sliderLeft" class="slider-vertical slider-left" min="0" max="100" value="0">
    <input type="range" id="sliderRight" class="slider-vertical slider-right" min="0" max="100" value="0">

    <div class="bottom-controls">
        <input type="range" id="sliderCenter" class="slider-horizontal" min="0" max="100" value="50">
        <button id="myButton" class="btn">Klick mich</button>
    </div>

    <script>
        // --- UI & Slider Logik ---
        const sLeft = document.getElementById('sliderLeft');
        const sRight = document.getElementById('sliderRight');
        const sCenter = document.getElementById('sliderCenter');
        const btn = document.getElementById('myButton');
        const statusText = document.getElementById('motorStatus');

        let targetCenter = 50, currentCenter = 50;
        let valLeft = 0, valRight = 0;
        const gravity = 1.5, liftSpeed = 3.5, friction = 0.15;
        const keys = { w: false, s: false };

        window.addEventListener('mousemove', (e) => { targetCenter = (e.clientX / window.innerWidth) * 100; });
        
        // --- Web Audio API Setup ---
        let audioCtx = null;
        let audioBuffers = {};
        
        // Gain Nodes für präzises Mischen
        let idleGainNode = null;
        let driveGainNode = null;
        let bgGainNode = null;
        
        // Aktive Audio-Quellen
        let activeSources = { start: null, idle: null, drive: null, bg: null, stop: null };
        let motorRunning = false;
        let isBraking = false;
        let lastLoad = 0; // Zur Erkennung von Lastabfall (für Auspuffknallen)

        // Sound-Dateien
        const soundFiles = {
            start: 'start.wav',
            bg: 'background.wav',
            idle: 'idle1.wav',
            drive: 'drive.wav',
            stop: 'stop.wav',
            pop: 'pop.wav'
        };

        async function loadSounds() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            statusText.innerText = "Lade Sounds...";
            
            for (let name in soundFiles) {
                try {
                    const response = await fetch(soundFiles[name]);
                    const arrayBuffer = await response.arrayBuffer();
                    audioBuffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.error("Fehler beim Laden von " + soundFiles[name], e);
                }
            }
            statusText.innerText = "Motor: AUS (Enter drücken)";
        }

        function playSound(buffer, loop = false, gainNode = null) {
            if (!buffer) return null;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = loop;
            
            const destination = gainNode || audioCtx.destination;
            source.connect(destination);
            source.start(0);
            return source;
        }

        // --- Auspuff Knallen (Pops & Bangs) ---
        function triggerExhaustPop(volume) {
            if (!motorRunning || !audioBuffers['pop']) return;
            
            // Zufällige leichte Tonhöhenänderung für mehr Realismus
            const popGain = audioCtx.createGain();
            popGain.gain.setValueAtTime(volume, audioCtx.currentTime);
            popGain.connect(audioCtx.destination);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers['pop'];
            // Pitch leicht variieren (zwischen 0.85 und 1.15)
            source.playbackRate.setValueAtTime(0.85 + Math.random() * 0.3, audioCtx.currentTime);
            source.connect(popGain);
            source.start(0);
        }

        // Loop zur permanenten Überprüfung von Auspuff-Fehlzündungen
        setInterval(() => {
            if (!motorRunning) return;

            // Aktuelle Last berechnen (Durchschnitt der vertikalen Slider)
            let currentLoad = (valLeft + valRight) / 2;

            // Wenn die Last abrupt abfällt (vom Gas gegangen), besteht Chance auf Knallen
            if (lastLoad > 20 && currentLoad < lastLoad - 5) {
                if (Math.random() < 0.35) { // 35% Chance pro Intervall bei Gaswechsel
                    let intensity = Math.min(1, (lastLoad - currentLoad) / 50) * (0.4 + Math.random() * 0.6);
                    triggerExhaustPop(intensity);
                }
            } 
            // Gelegentliches, leises Blubbern im Idle-Zustand
            else if (currentLoad < 5 && Math.random() < 0.05) {
                triggerExhaustPop(0.1 + Math.random() * 0.15);
            }

            lastLoad = currentLoad;
        }, 150);


        // --- Motor Start ---
        function startMotor() {
            if (motorRunning) return;
            motorRunning = true;
            statusText.innerText = "Motor: STARTET...";

            if (activeSources.stop) { try { activeSources.stop.stop(); } catch(e){} }

            const startBuf = audioBuffers['start'];
            activeSources.start = playSound(startBuf, false);

            if (startBuf) {
                const halfDuration = startBuf.duration / 2;

                setTimeout(() => {
                    if (!motorRunning) return;
                    statusText.innerText = "Motor: LÄUFT";

                    // Gain Nodes initialisieren
                    idleGainNode = audioCtx.createGain();
                    driveGainNode = audioCtx.createGain();
                    bgGainNode = audioCtx.createGain();
                    
                    idleGainNode.connect(audioCtx.destination);
                    driveGainNode.connect(audioCtx.destination);
                    bgGainNode.connect(audioCtx.destination);

                    // Standard-Lautstärken setzen
                    idleGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    driveGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    bgGainNode.gain.setValueAtTime(1, audioCtx.currentTime);

                    // Loops starten
                    activeSources.idle = playSound(audioBuffers['idle'], true, idleGainNode);
                    activeSources.drive = playSound(audioBuffers['drive'], true, driveGainNode);
                    activeSources.bg = playSound(audioBuffers['bg'], true, bgGainNode);

                }, halfDuration * 1000);
            }
        }

        // --- Motor Komplett-Stopp (über Backspace/Delete) ---
        function stopMotor() {
            if (!motorRunning) return;
            motorRunning = false;
            statusText.innerText = "Motor: SCHALTET AUS...";

            if (activeSources.start) { try { activeSources.start.stop(); } catch(e){} }

            const stopBuf = audioBuffers['stop'];
            activeSources.stop = playSound(stopBuf, false);

            if (stopBuf) {
                const halfDuration = stopBuf.duration / 2;

                setTimeout(() => {
                    if (motorRunning) return;
                    const fadeTime = 0.5;
                    const now = audioCtx.currentTime;

                    if (idleGainNode) idleGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                    if (driveGainNode) driveGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                    if (bgGainNode) bgGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);

                    setTimeout(() => {
                        if (motorRunning) return;
                        if (activeSources.idle) { try{activeSources.idle.stop();}catch(e){} activeSources.idle = null; }
                        if (activeSources.drive) { try{activeSources.drive.stop();}catch(e){} activeSources.drive = null; }
                        if (activeSources.bg) { try{activeSources.bg.stop();}catch(e){} activeSources.bg = null; }
                        statusText.innerText = "Motor: AUS (Enter drücken)";
                    }, fadeTime * 1000);

                }, halfDuration * 1000);
            }
        }

        // --- Tasten-Abfragen ---
        window.addEventListener('keydown', (e) => {
            if (!audioCtx) {
                loadSounds();
                return;
            }

            const key = e.key.toLowerCase();
            if (key === 's') keys.s = true;
            if (key === 'w') keys.w = true;
            
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                btn.classList.add('active');
                btn.click();
            }

            if (e.key === 'Enter') startMotor();
            if (e.key === 'Backspace' || e.key === 'Delete') stopMotor();
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 's') keys.s = false;
            if (key === 'w') keys.w = false;
            if (e.key === ' ' || e.code === 'Space') btn.classList.remove('active');
        });

        // --- Physik & Dynamischer Audio-Mix Loop ---
        function updatePhysics() {
            currentCenter += (targetCenter - currentCenter) * friction;
            sCenter.value = currentCenter;

            if (keys.s) valLeft = Math.min(100, valLeft + liftSpeed);
            else valLeft = Math.max(0, valLeft - gravity);
            sLeft.value = valLeft;

            if (keys.w) valRight = Math.min(100, valRight + liftSpeed);
            else valRight = Math.max(0, valRight - gravity);
            sRight.value = valRight;

            // --- AUDIO ENGINE UPDATE ---
            if (motorRunning && idleGainNode && driveGainNode) {
                
                // 1. Brems-Logik: W und S sind gleichzeitig gedrückt
                if (keys.w && keys.s) {
                    if (!isBraking) {
                        isBraking = true;
                        statusText.innerText = "Motor: BREMST!";
                        // Spiele Bremsgeräusch ab
                        if (audioBuffers['stop']) {
                            playSound(audioBuffers['stop'], false);
                        }
                    }
                    // Während des Bremsens regeln wir die Antriebssounds drastisch runter
                    idleGainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
                    driveGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                } 
                else {
                    // Bremsstatus zurücksetzen, sobald eine Taste losgelassen wird
                    if (isBraking) {
                        isBraking = false;
                        statusText.innerText = "Motor: LÄUFT";
                    }

                    // 2. Normaler Fahr-Mix basierend auf Slider-Auslastung (0 bis 100)
                    let engineLoad = (valLeft + valRight) / 2; // Durchschnittliche Last

                    // Ab hälfte (50%) fadet idle1 aus und drive setzt ein
                    let idleVolume = 1;
                    let driveVolume = 0;

                    if (engineLoad <= 50) {
                        // Von 0% bis 50% Last: Idle bleibt voll da, Drive fängt langsam an
                        idleVolume = 1;
                        driveVolume = engineLoad / 50; 
                    } else {
                        // Von 50% bis 100% Last: Idle fadet komplett aus, Drive ist voll da
                        idleVolume = 1 - ((engineLoad - 50) / 50);
                        driveVolume = 1;
                    }

                    // Werte glatt anwenden (verhindert digitales Knacken)
                    idleGainNode.gain.setTargetAtTime(idleVolume, audioCtx.currentTime, 0.1);
                    driveGainNode.gain.setTargetAtTime(driveVolume, audioCtx.currentTime, 0.1);
                    
                    // Pitch (Tonhöhe) leicht anheben je nach Drehzahl/Last für realistischeren Sound
                    if(activeSources.idle) activeSources.idle.playbackRate.setValueAtTime(1 + (engineLoad / 200), audioCtx.currentTime);
                    if(activeSources.drive) activeSources.drive.playbackRate.setValueAtTime(0.9 + (engineLoad / 150), audioCtx.currentTime);
                }
            }

            requestAnimationFrame(updatePhysics);
        }
        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
