<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Vehicle & Turret Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-color: #f0f2f5;
            overflow: hidden;
            padding-bottom: 30px;
            user-select: none;
        }

        .slider-vertical {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            width: 200px;
        }

        .slider-left { left: -60px; }
        .slider-right { right: -60px; }

        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .slider-horizontal { width: 100%; }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.1s;
        }

        .btn.active {
            background-color: #003d7a;
            transform: scale(0.98);
        }

        #motorStatus {
            position: absolute;
            top: 20px;
            font-weight: bold;
            color: #555;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="motorStatus">Motor: AUS<br>(Beliebige Taste drücken zum Aktivieren, ENTER zum Starten)</div>

    <input type="range" id="sliderLeft" class="slider-vertical slider-left" min="0" max="100" value="0">
    <input type="range" id="sliderRight" class="slider-vertical slider-right" min="0" max="100" value="0">

    <div class="bottom-controls">
        <input type="range" id="sliderCenter" class="slider-horizontal" min="0" max="100" value="50">
        <button id="myButton" class="btn">Klick mich</button>
    </div>

    <script>
        // --- UI & Slider ---
        const sLeft = document.getElementById('sliderLeft');
        const sRight = document.getElementById('sliderRight');
        const sCenter = document.getElementById('sliderCenter');
        const btn = document.getElementById('myButton');
        const statusText = document.getElementById('motorStatus');

        let targetCenter = 50, currentCenter = 50;
        
        // Physikalische Variablen
        let vehicleSpeed = 0;   
        let engineRPM = 0;      
        let valLeft = 0;        
        let valRight = 0;       
        
        const maxSpeed = 100;
        const acceleration = 1.2;    
        const brakingPower = 3.0;    
        const rollFriction = 0.25;   
        const engineResponse = 0.2;  
        const friction = 0.15;
        
        const keys = { w: false, s: false };

        // --- Web Audio API Setup ---
        let audioCtx = null;
        let audioBuffers = {};
        
        // Gain Nodes
        let idleGainNode = null;
        let driveGainNode = null;
        let bgGainNode = null;
        let turretLoopGainNode = null;
        
        // Aktive Quellen
        let activeSources = { start: null, idle: null, drive: null, bg: null, turretLoop: null };
        
        // Zustände Engine & Waffe
        let motorRunning = false;
        let isBraking = false;
        let hasLaunched = false; 
        let lastRPM = 0;
        let soundsLoaded = false;
        let weaponState = "idle"; // "idle", "ready", "cooldown"
        let cooldownTimer = 0;

        // Zustände Maus / Turret
        let isMouseMoving = false;
        let mouseTimeout = null;
        let turretState = "stopped"; // "stopped", "starting", "looping", "stopping"

        const soundFiles = {
            start: 'start.wav',
            bg: 'background.wav',
            idle: 'idle1.wav',
            drive: 'drive.wav',
            stop: 'stop.wav',
            pop: 'pop.wav',
            gas: 'gas.wav',
            turretstart: 'turretstart.wav',
            turretloop: 'turretloop.wav',
            turretstop: 'turretstop.wav',
            creak1: 'creak1.wav',
            creak2: 'creak2.wav',
            creak3: 'creak3.wav',
            creak4: 'creak4.wav',
            ready: 'ready.wav',
            fire: 'fire.wav'
        };

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            await loadSounds();
        }

        async function loadSounds() {
            statusText.innerHTML = "Lade Sounds...";
            for (let name in soundFiles) {
                try {
                    const response = await fetch(soundFiles[name]);
                    const arrayBuffer = await response.arrayBuffer();
                    audioBuffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.error("Fehler beim Laden von " + soundFiles[name], e);
                }
            }
            soundsLoaded = true;
            statusText.innerHTML = "Engine & Turret bereit!<br>(ENTER drücken zum Starten)";
        }

        function playSound(buffer, loop = false, gainNode = null) {
            if (!buffer || !audioCtx) return null;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = loop;
            
            const destination = gainNode || audioCtx.destination;
            source.connect(destination);
            source.start(0);
            return source;
        }

        // --- Auspuff Knallen (Deutlich präsenter & lauter) ---
        function triggerExhaustPop(volume) {
            if (!motorRunning || !audioBuffers['pop'] || !audioCtx) return;
            
            const popGain = audioCtx.createGain();
            // Erhöhte Lautstärken-Präsenz für deutliche Knaller
            popGain.gain.setValueAtTime(volume * 0.9, audioCtx.currentTime);
            popGain.connect(audioCtx.destination);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers['pop'];
            // Variablerer Pitch für dreckigen Sound
            source.playbackRate.setValueAtTime(0.75 + Math.random() * 0.4, audioCtx.currentTime);
            source.connect(popGain);
            source.start(0);
        }

        // Dynamische Druckentlastung (gas.wav)
        function triggerGasVent(volume = 0.6) {
            if (!motorRunning || !audioBuffers['gas']) return;
            const gasGain = audioCtx.createGain();
            gasGain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gasGain.connect(audioCtx.destination);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers['gas'];
            source.connect(gasGain);
            source.start(0);
        }

        // Lastwechsel-Prüfung für Auspuff
        setInterval(() => {
            if (!motorRunning) return;

            if (lastRPM > 25 && engineRPM < lastRPM - 2) {
                if (Math.random() < 0.5) { 
                    let intensity = Math.min(1, (lastRPM - engineRPM) / 22) * (0.6 + Math.random() * 0.4);
                    triggerExhaustPop(intensity);
                }
            } else if (engineRPM < 15 && Math.random() < 0.05) {
                triggerExhaustPop(0.15 + Math.random() * 0.15); 
            }
            lastRPM = engineRPM;
        }, 100);

        // --- Mausbewegung & Turret-Logik ---
        window.addEventListener('mousemove', (e) => { 
            targetCenter = (e.clientX / window.innerWidth) * 100; 

            if (!motorRunning || !soundsLoaded) return;

            // Turret Starten
            if (turretState === "stopped" || turretState === "stopping") {
                turretState = "starting";
                
                const startBuf = audioBuffers['turretstart'];
                if (startBuf) {
                    playSound(startBuf, false);
                    const halfDuration = (startBuf.duration / 2) * 1000;

                    setTimeout(() => {
                        if (turretState !== "starting") return;
                        turretState = "looping";

                        turretLoopGainNode = audioCtx.createGain();
                        turretLoopGainNode.connect(audioCtx.destination);
                        turretLoopGainNode.gain.setValueAtTime(0.7, audioCtx.currentTime);
                        
                        activeSources.turretLoop = playSound(audioBuffers['turretloop'], true, turretLoopGainNode);
                    }, halfDuration);
                }
            }

            // Gelegentliches Quietschen während der Turmdrehung
            if (turretState === "looping" && Math.random() < 0.04) {
                const creakFiles = ['creak1', 'creak2', 'creak3', 'creak4'];
                const randomCreak = creakFiles[Math.floor(Math.random() * creakFiles.length)];
                if (audioBuffers[randomCreak]) {
                    const creakGain = audioCtx.createGain();
                    creakGain.gain.setValueAtTime(0.3 + Math.random() * 0.3, audioCtx.currentTime);
                    creakGain.connect(audioCtx.destination);
                    const src = playSound(audioBuffers[randomCreak], false, creakGain);
                    if(src) src.playbackRate.setValueAtTime(0.9 + Math.random()*0.2, audioCtx.currentTime);
                }
            }

            // Timeout-Erkennung für das Stoppen der Maus
            clearTimeout(mouseTimeout);
            mouseTimeout = setTimeout(() => {
                if (turretState === "looping" || turretState === "starting") {
                    turretState = "stopping";
                    
                    const stopBuf = audioBuffers['turretstop'];
                    if (stopBuf) {
                        playSound(stopBuf, false);
                        const halfDuration = (stopBuf.duration / 2) * 1000;

                        // Ab der Hälfte des Stop-Sounds fließend den Loop beenden
                        setTimeout(() => {
                            if (turretState !== "stopping") return;
                            if (activeSources.turretLoop) {
                                try { activeSources.turretLoop.stop(); } catch(e){}
                                activeSources.turretLoop = null;
                            }
                            turretState = "stopped";
                        }, halfDuration);
                    } else {
                        if (activeSources.turretLoop) { activeSources.turretLoop.stop(); activeSources.turretLoop = null; }
                        turretState = "stopped";
                    }
                }
            }, 150); // Millisekunden Inaktivität bis Stopp erkannt wird
        });
        
        // --- Waffensystem (Space-Logik) ---
        function handleWeaponTrigger() {
            if (!motorRunning || !soundsLoaded) return;

            if (weaponState === "idle") {
                weaponState = "ready";
                playSound(audioBuffers['ready'], false);
            } 
            else if (weaponState === "ready") {
                weaponState = "cooldown";
                playSound(audioBuffers['fire'], false);
                
                cooldownTimer = 5; // 5 Sekunden Sperre
                let interval = setInterval(() => {
                    cooldownTimer--;
                    if (cooldownTimer <= 0) {
                        clearInterval(interval);
                        weaponState = "idle";
                    }
                }, 1000);
            }
        }

        // --- Motor Start ---
        function startMotor() {
            if (motorRunning || !soundsLoaded) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            motorRunning = true;
            statusText.innerHTML = "Motor: STARTET...";

            const startBuf = audioBuffers['start'];
            activeSources.start = playSound(startBuf, false);

            if (startBuf) {
                const halfDuration = startBuf.duration / 2;
                setTimeout(() => {
                    if (!motorRunning) return;

                    idleGainNode = audioCtx.createGain();
                    driveGainNode = audioCtx.createGain();
                    bgGainNode = audioCtx.createGain();
                    
                    idleGainNode.connect(audioCtx.destination);
                    driveGainNode.connect(audioCtx.destination);
                    bgGainNode.connect(audioCtx.destination);

                    idleGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    driveGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    bgGainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                    activeSources.idle = playSound(audioBuffers['idle'], true, idleGainNode);
                    activeSources.drive = playSound(audioBuffers['drive'], true, driveGainNode);
                    activeSources.bg = playSound(audioBuffers['bg'], true, bgGainNode);

                }, halfDuration * 1000);
            }
        }

        // --- Motor Stopp ---
        function stopMotor() {
            if (!motorRunning) return;
            motorRunning = false;
            statusText.innerHTML = "Motor: SCHALTET AUS...";

            if (activeSources.start) { try { activeSources.start.stop(); } catch(e){} }

            const stopBuf = audioBuffers['stop'];
            playSound(stopBuf, false);

            if (stopBuf) {
                const fadeTime = 0.4;
                const now = audioCtx.currentTime;

                if (idleGainNode) idleGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                if (driveGainNode) driveGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);
                if (bgGainNode) bgGainNode.gain.linearRampToValueAtTime(0, now + fadeTime);

                setTimeout(() => {
                    if (motorRunning) return;
                    if (activeSources.idle) { try{activeSources.idle.stop();}catch(e){} }
                    if (activeSources.drive) { try{activeSources.drive.stop();}catch(e){} }
                    if (activeSources.bg) { try{activeSources.bg.stop();}catch(e){} }
                    statusText.innerHTML = "Motor: AUS<br>(ENTER drücken zum Starten)";
                }, fadeTime * 1000);
            }
        }

        // --- Tasten-Abfragen ---
        window.addEventListener('keydown', async (e) => {
            if (!audioCtx) { await initAudio(); }

            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true; 
            if (key === 's') keys.s = true; 
            
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                btn.classList.add('active');
                btn.click();
                handleWeaponTrigger(); // Waffensystem aufrufen
            }

            if (e.key === 'Enter') startMotor();
            if (e.key === 'Backspace' || e.key === 'Delete') stopMotor();
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 's') keys.s = false;
            if (e.key === ' ' || e.code === 'Space') btn.classList.remove('active');
        });

        // --- Physik & Audio Core Loop ---
        function updatePhysics() {
            currentCenter += (targetCenter - currentCenter) * friction;
            sCenter.value = currentCenter;

            // --- 1. PEDAL PHYSIK ---
            let targetRPM = 0;

            if (motorRunning) {
                // BREMSEN (S gedrückt während Fahrt)
                if (keys.s && vehicleSpeed > 0) {
                    vehicleSpeed = Math.max(0, vehicleSpeed - brakingPower);
                    targetRPM = vehicleSpeed * 0.2; 
                    valLeft = 100;                  
                    valRight = vehicleSpeed;        
                    
                    if (!isBraking) {
                        isBraking = true;
                        playSound(audioBuffers['stop'], false); 
                        triggerGasVent(0.7); // Druckentladung beim harten Abbremsen
                    }
                } else {
                    if (isBraking) {
                        isBraking = false;
                        triggerGasVent(0.5); // Kurzes Zischen beim Lösen der Bremse
                    }
                    valLeft = 0; 

                    // GAS GEBEN (W)
                    if (keys.w) {
                        vehicleSpeed = Math.min(maxSpeed, vehicleSpeed + acceleration);
                        targetRPM = vehicleSpeed * 0.7 + 30; 
                        valRight = vehicleSpeed;
                    } else {
                        // AUSROLLEN / STILLSTAND
                        let oldSpeed = vehicleSpeed;
                        vehicleSpeed = Math.max(0, vehicleSpeed - rollFriction);
                        targetRPM = vehicleSpeed * 0.4;
                        valRight = vehicleSpeed;

                        // Exakt im Moment des Stehenbleibens Druckentlastung (gas.wav)
                        if (oldSpeed > 0 && vehicleSpeed === 0) {
                            triggerGasVent(0.8);
                        }
                    }
                }
                
                engineRPM += (targetRPM - engineRPM) * engineResponse;
            } else {
                vehicleSpeed = 0;
                engineRPM = 0;
                valLeft = 0;
                valRight = 0;
            }

            sLeft.value = valLeft;
            sRight.value = valRight;

            // --- 2. AUDIO & UI TEXT ENGINE ---
            if (motorRunning && idleGainNode && driveGainNode) {
                const now = audioCtx.currentTime;
                const transitionSpeed = 0.05; 

                // Losfahr-Effekt aus dem Stand (Kicker + Gasdruck)
                if (vehicleSpeed > 5 && !hasLaunched) {
                    hasLaunched = true;
                    playSound(audioBuffers['stop'], false); 
                    triggerGasVent(0.5); 
                } else if (vehicleSpeed <= 2) {
                    hasLaunched = false;
                }

                // Generierung des Waffen-Status-Strings
                let weaponStatusText = "";
                if (weaponState === "idle") weaponStatusText = "BEREIT ZUM LADEN";
                if (weaponState === "ready") weaponStatusText = "FEUERBEREIT (Space!)";
                if (weaponState === "cooldown") weaponStatusText = `RELOAD IN ${cooldownTimer}s`;

                // UI Text-Update
                if (isBraking) {
                    statusText.innerHTML = `Motor: BREMST! | Speed: ${Math.round(vehicleSpeed)} km/h<br>Waffe: ${weaponStatusText}`;
                } else if (vehicleSpeed > 5) {
                    statusText.innerHTML = `Motor: FAHRT (${engineRPM > 65 ? 'Vollgas' : 'Beschleunigt'}) | Speed: ${Math.round(vehicleSpeed)} km/h<br>Waffe: ${weaponStatusText}`;
                } else {
                    statusText.innerHTML = `Motor: LEERLAUF | Speed: 0 km/h<br>Waffe: ${weaponStatusText}`;
                }

                // CROSSFADE-BERECHNUNG (Wechsel bei halber Last/RPM)
                let targetIdle = 1;
                let targetDrive = 0;

                if (engineRPM <= 50) {
                    targetIdle = 1;
                    targetDrive = engineRPM / 50;
                } else {
                    targetIdle = 1 - ((engineRPM - 50) / 50);
                    targetDrive = 1;
                }

                if (isBraking) {
                    targetIdle = 0.3;
                    targetDrive = 0.0;
                }

                // Fades anwenden
                idleGainNode.gain.linearRampToValueAtTime(targetIdle, now + transitionSpeed);
                driveGainNode.gain.linearRampToValueAtTime(targetDrive, now + transitionSpeed);
                
                // Pitch-Modulation
                if (activeSources.idle) activeSources.idle.playbackRate.setValueAtTime(0.95 + (engineRPM / 200), now);
                if (activeSources.drive) activeSources.drive.playbackRate.setValueAtTime(0.8 + (engineRPM / 110), now);
            }

            requestAnimationFrame(updatePhysics);
        }
        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
