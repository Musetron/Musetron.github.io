<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C. elegans - Neural Network Controller & Simulation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      background: #111;
      font-family: monospace;
    }

    #canvas { 
      display: block;
      filter: blur(1px);
      width: 100vw;
      height: 100vh;
    }

    #brain-hud {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 280px;
      height: 280px;
      background: rgba(15, 15, 20, 0.85);
      border: 1px solid #33ffaa44;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(51, 255, 170, 0.1);
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    #brain-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #brain-info {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      color: #00ffcc;
      font-size: 11px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      text-shadow: 0 0 4px #000;
    }

    .act-tag {
      padding: 2px 4px;
      border-radius: 3px;
      background: rgba(0,0,0,0.5);
    }
  </style>

  <!-- Three.js & Zubehör -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="brain-hud">
    <div id="brain-canvas"></div>
    <div id="brain-info">
      <span id="state-sens" class="act-tag" style="color:#ffff00">SENS: 0%</span>
      <span id="state-proc" class="act-tag" style="color:#0099ff">PROC: 0%</span>
      <span id="state-mot" class="act-tag" style="color:#00ff55">MOT: 0%</span>
    </div>
  </div>

<script>
// ==========================================
// 1. NEURONALER ZUSTAND (Aktivitäts-Variablen)
// ==========================================
const brainActivity = {
  sensory: 0.1,    // Gelb (Außen: Sensoren)
  processing: 0.1, // Blau (Mitte: Interneuronen)
  motor: 0.1       // Grün (Innen: Muskeln/Motorik)
};

// ==========================================
// 2. THREE.JS 3D-GEHIRN (HUD / Oben Rechts)
// ==========================================
const hudContainer = document.getElementById('brain-canvas');
const brainScene = new THREE.Scene();

const brainCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
const brainRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
brainRenderer.setSize(280, 280);
hudContainer.appendChild(brainRenderer.domElement);

const brainControls = new THREE.OrbitControls(brainCamera, brainRenderer.domElement);
brainControls.enableDamping = true;
brainControls.autoRotate = true;
brainControls.autoRotateSpeed = 1.5;

brainScene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 2, 1);
brainScene.add(dirLight);

// Farben definieren
const baseColors = {
  motor: new THREE.Color(0x00cc44),      // Grün (Innen)
  processing: new THREE.Color(0x0066ff), // Blau (Mitte)
  sensory: new THREE.Color(0xffff00)     // Gelb (Außen)
};

let brainGeometryRef = null;
let originalNormDists = [];

function createFallbackBrain() {
  const geo = new THREE.IcosahedronGeometry(2, 3);
  const mat = new THREE.MeshStandardMaterial({ wireframe: true, color: 0x00ffcc });
  const mesh = new THREE.Mesh(geo, mat);
  brainScene.add(mesh);
  brainCamera.position.z = 5;
}

// OBJ Loader
const loader = new THREE.OBJLoader();
loader.load(
  'brain.obj',
  function (object) {
    const box = new THREE.Box3().setFromObject(object);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    object.position.sub(center);

    object.traverse(child => {
      if (child.isMesh) {
        const geometry = child.geometry;
        brainGeometryRef = geometry;
        const posAttr = geometry.attributes.position;
        const colorArr = new Float32Array(posAttr.count * 3);

        let maxRadius = 0;
        for (let i = 0; i < posAttr.count; i++) {
          const dist = Math.hypot(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
          if (dist > maxRadius) maxRadius = dist;
        }

        for (let i = 0; i < posAttr.count; i++) {
          const dist = Math.hypot(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
          originalNormDists.push(dist / maxRadius);
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
        child.material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.3,
          metalness: 0.1,
          wireframe: false
        });
      }
    });

    brainScene.add(object);
    const maxDim = Math.max(size.x, size.y, size.z);
    brainCamera.position.z = maxDim * 1.8;
  },
  undefined,
  function (error) {
    console.warn("brain.obj konnte nicht geladen werden. Nutze Fallback.", error);
    createFallbackBrain();
  }
);

// Weicher Übergang zwischen den Farben (Interpolation)
function lerpColor(colorA, colorB, t) {
  return new THREE.Color().copy(colorA).lerp(colorB, Math.min(Math.max(t, 0), 1));
}

// Dynamische Farb- & Aktivitätsberechnung
function updateBrainGlow() {
  if (!brainGeometryRef || originalNormDists.length === 0) return;

  const colorAttr = brainGeometryRef.attributes.color;
  const count = originalNormDists.length;

  for (let i = 0; i < count; i++) {
    const normDist = originalNormDists[i]; // 0.0 (Zentrum) bis 1.0 (Außenrand)
    
    let baseColor = new THREE.Color();
    let activity = 0;

    // Biologisch korrekte Schichtung (Innen = Motorik, Mitte = Interneuronen, Außen = Sensoren)
    if (normDist < 0.4) {
      // Reiner Kern (Motorik - Grün)
      baseColor.copy(baseColors.motor);
      activity = brainActivity.motor;
    } else if (normDist < 0.7) {
      // Übergang Motorik -> Interneuronen (Mitte - Blau)
      const t = (normDist - 0.4) / 0.3;
      baseColor = lerpColor(baseColors.motor, baseColors.processing, t);
      activity = brainActivity.motor * (1 - t) + brainActivity.processing * t;
    } else {
      // Übergang Interneuronen -> Sensoren (Außen - Gelb)
      const t = (normDist - 0.7) / 0.3;
      baseColor = lerpColor(baseColors.processing, baseColors.sensory, t);
      activity = brainActivity.processing * (1 - t) + brainActivity.sensory * t;
    }

    // Leuchtintensität skalieren
    const intensity = 0.15 + (activity * 1.5);

    colorAttr.setXYZ(
      i,
      Math.min(1.0, baseColor.r * intensity),
      Math.min(1.0, baseColor.g * intensity),
      Math.min(1.0, baseColor.b * intensity)
    );
  }
  colorAttr.needsUpdate = true;

  // HUD Text-Aktualisierung
  document.getElementById('state-sens').innerText = `SENS: ${Math.round(brainActivity.sensory * 100)}%`;
  document.getElementById('state-proc').innerText = `PROC: ${Math.round(brainActivity.processing * 100)}%`;
  document.getElementById('state-mot').innerText = `MOT: ${Math.round(brainActivity.motor * 100)}%`;
}

// ==========================================
// 3. WURM SIMULATION (Canvas 2D)
// ==========================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const wormImg = new Image();
wormImg.src = "https://iili.io/qvUJL2S.png";
const SEGMENTS = 25;
let skeleton = [];
let segmentLength = 20;

wormImg.onload = () => {
  segmentLength = wormImg.width / SEGMENTS;
  for (let i = 0; i < SEGMENTS; i++) {
    skeleton.push({ x: canvas.width / 2 - i * segmentLength, y: canvas.height / 2 });
  }
  animate();
};

const tip = { x: canvas.width / 2, y: canvas.height / 2 };

function random(min, max) { return Math.random() * (max - min) + min; }

function getNextTarget(currentX, currentY) {
  let x, y;
  if (Math.random() < 0.7) {
    x = currentX + random(-100, 100);
    y = currentY + random(-100, 100);
  } else {
    x = currentX + random(-300, 300);
    y = currentY + random(-300, 300);
  }
  x = Math.max(50, Math.min(window.innerWidth - 50, x));
  y = Math.max(50, Math.min(window.innerHeight - 50, y));
  return { x, y };
}

// Zeitversetzte Signalverarbeitung (Sensor -> Interneuron -> Motor)
function triggerNeuralCascade() {
  // 1. Erst feuert die Sensorik (Gelb)
  brainActivity.sensory = 1.0;
  
  // 2. Nach 150ms verarbeitet das Zentrum das Signal (Blau)
  setTimeout(() => {
    brainActivity.processing = 0.9;
  }, 150);

  // 3. Nach 300ms geht der Befehl an die Muskeln (Grün)
  setTimeout(() => {
    brainActivity.motor = 1.0;
  }, 300);
}

function moveTo(x, y, duration = null) {
  return new Promise(resolve => {
    const startX = tip.x;
    const startY = tip.y;
    const distance = Math.hypot(x - startX, y - startY);
    if (!duration) duration = Math.max(400, distance * random(2, 4));

    let startTime = null;
    const wobble = [];
    for (let i = 0; i < 3; i++) {
      wobble.push({ freq: random(0.3, 1.5), amp: random(2, 8), phase: random(0, Math.PI * 2) });
    }

    // KASKADE AUSLÖSEN
    triggerNeuralCascade();

    function animateTip(time) {
      if (!startTime) startTime = time;
      let t = (time - startTime) / duration;
      if (t > 1) t = 1;
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

      let tipX = startX + (x - startX) * ease;
      let tipY = startY + (y - startY) * ease;

      wobble.forEach(w => {
        tipX += Math.sin(t * Math.PI * 2 * w.freq + w.phase) * w.amp * (1 - t);
        tipY += Math.cos(t * Math.PI * 2 * w.freq + w.phase) * w.amp * (1 - t);
      });

      tip.x = tipX;
      tip.y = tipY;

      if (t < 1) requestAnimationFrame(animateTip);
      else resolve();
    }
    requestAnimationFrame(animateTip);
  });
}

async function microPause(duration) {
  const pauseStart = performance.now();
  while (performance.now() - pauseStart < duration) {
    const t = (performance.now() - pauseStart) / duration;
    tip.x += Math.sin(t * Math.PI * 2 * random(0.5, 1.2)) * random(0.1, 1.2);
    tip.y += Math.cos(t * Math.PI * 2 * random(0.5, 1.2)) * random(0.1, 1.2);
    await new Promise(r => requestAnimationFrame(r));
  }
}

async function loopMarker() {
  while (true) {
    const { x, y } = getNextTarget(tip.x, tip.y);
    await moveTo(x, y);
    await microPause(random(200, 1000));
  }
}
loopMarker();

function getCatmullRomPoint(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
  const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
  return { x, y };
}

function updateSkeleton() {
  if (skeleton.length === 0) return;
  let head = skeleton[0];
  let dx = tip.x - head.x;
  let dy = tip.y - head.y;
  let angle = Math.atan2(dy, dx);
  
  head.x += Math.cos(angle) * 5;
  head.y += Math.sin(angle) * 5;

  for (let i = 1; i < SEGMENTS; i++) {
    let prev = skeleton[i - 1];
    let seg = skeleton[i];
    let sdx = seg.x - prev.x;
    let sdy = seg.y - prev.y;
    let dist = Math.hypot(sdx, sdy);
    if (dist === 0) continue;
    let diff = dist - segmentLength;
    seg.x -= (sdx / dist) * diff;
    seg.y -= (sdy / dist) * diff;
  }
}

function drawWorm() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (skeleton.length < SEGMENTS) return;

  const imgH = wormImg.height;
  const steps = wormImg.width;
  for (let i = 0; i < steps; i++) {
    const t = i / steps * (SEGMENTS - 3) + 1;
    const seg = Math.floor(t);
    const localT = t - seg;
    const p0 = skeleton[Math.max(seg - 1, 0)];
    const p1 = skeleton[seg];
    const p2 = skeleton[Math.min(seg + 1, SEGMENTS - 1)];
    const p3 = skeleton[Math.min(seg + 2, SEGMENTS - 1)];
    const pos = getCatmullRomPoint(p0, p1, p2, p3, localT);

    const nextT = Math.min(localT + 0.01, 1);
    const nextPos = getCatmullRomPoint(p0, p1, p2, p3, nextT);
    const angle = Math.atan2(nextPos.y - pos.y, nextPos.x - pos.x);

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(angle);
    ctx.drawImage(wormImg, i, 0, 1, imgH, 0, -imgH / 2, 1, imgH);
    ctx.restore();
  }
}

// ==========================================
// 4. MAIN ANIMATION LOOP
// ==========================================
function animate() {
  updateSkeleton();
  drawWorm();

  // Abklingen der Aktivität (Dampening)
  brainActivity.sensory *= 0.93;
  brainActivity.processing *= 0.94;
  brainActivity.motor *= 0.95;

  updateBrainGlow();
  
  brainControls.update();
  brainRenderer.render(brainScene, brainCamera);

  requestAnimationFrame(animate);
}
</script>
</body>
</html>
