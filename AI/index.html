<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Neural Network & Insect Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        #video-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 110px;
            height: 80px;
            border: 2px solid #fff;
            border-radius: 6px;
            overflow: hidden;
            background: #222;
            z-index: 10;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #insect-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 110px;
            height: 110px;
            border: 2px solid #fff;
            border-radius: 6px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }
        #insect-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">Lernen: <span id="learn-state">AN</span> | Aktive Outputs: <span id="active-out">0</span>/6</div>

    <div id="insect-container">
        <canvas id="insect-canvas" width="200" height="200"></canvas>
    </div>

    <div id="video-container" title="Klicken, um Kamera zu wechseln">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <canvas id="canvas"></canvas>
    <video id="hidden-video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="hidden-cam-canvas" width="10" height="5" style="display:none;"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Kamera & Layout Variablen (Start-Zoom für Handys angepasst, damit das Netz sichtbar ist)
        let zoom = 0.35, camera_x = 0, camera_y = 0;
        let isDragging = false, lastX = 0, lastY = 0;
        let touchStartDist = 0;

        const SPACING = 40, RADIUS = 10;
        let isLearning = true;

        // Touch & Maus Steuerung
        canvas.addEventListener('pointerdown', e => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('pointermove', e => {
            if (!isDragging) return;
            camera_x -= (e.clientX - lastX) / zoom;
            camera_y -= (e.clientY - lastY) / zoom;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('pointerup', () => isDragging = false);
        canvas.addEventListener('pointercancel', () => isDragging = false);

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            let zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            zoom = Math.max(0.05, Math.min(zoom * zoomFactor, 10.0));
        }, { passive: false });

        // Pinch-Zoom
        canvas.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (touchStartDist) {
                    let zoomFactor = dist / touchStartDist;
                    zoom = Math.max(0.05, Math.min(zoom * zoomFactor, 10.0));
                }
                touchStartDist = dist;
            }
        });
        canvas.addEventListener('touchend', () => { touchStartDist = 0; });

        function worldToScreen(wx, wy) {
            return {
                x: (wx - camera_x) * zoom + canvas.width / 2,
                y: (wy - camera_y) * zoom + canvas.height / 2
            };
        }

        function createGrid(startX, startY, rows, cols, randomVals = false) {
            let grid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push([startX + c * SPACING, startY + r * SPACING, randomVals ? Math.floor(Math.random() * 10) : 0]);
                }
                grid.push(row);
            }
            return grid;
        }

        const gridSize = 4 * SPACING;
        const top_start_x = -gridSize / 2 - 250;
        const top_start_y = -220;
        const bottom_start_y = 60;

        let top_grid = createGrid(top_start_x, top_start_y, 5, 5, false);
        let bottom_grid = createGrid(top_start_x, bottom_start_y, 5, 5, false);

        const right_start_x = top_start_x + gridSize + 100;
        const total_height_others = (bottom_start_y + gridSize) - top_start_y;
        const right_start_y = top_start_y + (total_height_others - (9 * SPACING)) / 2;

        let right_column = [];
        for (let i = 0; i < 10; i++) right_column.push([right_start_x, right_start_y + i * SPACING, i]);

        let hidden_blocks = [];
        let hidden_start_x = right_start_x + 180;
        let hidden_block_width = 9 * SPACING;
        let hidden_gap = 120;
        let hidden_start_y = - (9 * SPACING) / 2;

        for (let b = 0; b < 5; b++) {
            let bx = hidden_start_x + b * (hidden_block_width + hidden_gap);
            hidden_blocks.push(createGrid(bx, hidden_start_y, 10, 10, true));
        }

        const output_start_x = hidden_blocks[4][0][9][0] + 120;
        const output_height = 5 * SPACING;
        const last_block_center_y = hidden_start_y + (9 * SPACING) / 2;
        const output_start_y = last_block_center_y - output_height / 2;
        const output_labels = ["Y", "X", "Z", "-Y", "-X", "-Z"];

        let output_column = [];
        for (let i = 0; i < 6; i++) output_column.push([output_start_x, output_start_y + i * SPACING, output_labels[i]]);

        function evaluateNetwork() {
            let all_vertical_layers = [right_column];
            for (let block of hidden_blocks) {
                for (let c = 0; c < 10; c++) {
                    all_vertical_layers.push(block.map(row => row[c]));
                }
            }
            all_vertical_layers.push(output_column);

            let active_paths = new Set();
            let start_nodes = [...Array(5).keys()].map(r => top_grid[r][4]).concat([...Array(5).keys()].map(r => bottom_grid[r][4]));

            let max_layer_reached = 0;
            let reached_output_indices = new Set();

            for (let start_node of start_nodes) {
                let target_val = start_node[2];
                let current_layer_nodes = [];
                let local_initial_paths = [];

                for (let r_node of right_column) {
                    if (r_node[2] === target_val) {
                        local_initial_paths.push(`${start_node[0]},${start_node[1]}-${r_node[0]},${r_node[1]}`);
                        if (!current_layer_nodes.includes(r_node)) current_layer_nodes.push(r_node);
                    }
                }
                if (current_layer_nodes.length === 0) continue;
                local_initial_paths.forEach(p => active_paths.add(p));

                for (let i = 0; i < all_vertical_layers.length - 1; i++) {
                    let next_layer = all_vertical_layers[i + 1];
                    let next_layer_valid = [];
                    let local_paths = [];
                    let is_output_step = (i === all_vertical_layers.length - 2);

                    for (let p1 of current_layer_nodes) {
                        for (let p2 of next_layer) {
                            if (is_output_step || p2[2] === target_val) {
                                local_paths.push(`${p1[0]},${p1[1]}-${p2[0]},${p2[1]}`);
                                if (!next_layer_valid.includes(p2)) next_layer_valid.push(p2);
                            }
                        }
                    }
                    if (next_layer_valid.length === 0) break;
                    max_layer_reached = Math.max(max_layer_reached, i + 1);

                    if (is_output_step) {
                        next_layer_valid.forEach(p2 => {
                            let idx = output_column.indexOf(p2);
                            if (idx !== -1) reached_output_indices.add(idx);
                        });
                    }
                    local_paths.forEach(p => active_paths.add(p));
                    current_layer_nodes = next_layer_valid;
                }
            }

            let num_active = reached_output_indices.size;
            let score = max_layer_reached * 50;
            if (num_active === 1) score += 200000;
            else if (num_active === 0) score -= 20000;
            else score -= num_active * 100000;

            return { active_paths, score, num_active, reached_output_indices };
        }

        // Kamera Setup: Standardmäßig RÜCKKAMERA ('environment')
        const video = document.getElementById('webcam');
        const hiddenVideo = document.getElementById('hidden-video');
        const hiddenCanvas = document.getElementById('hidden-cam-canvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        let useFrontCamera = false;

        async function initCamera() {
            try {
                if(video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                hiddenVideo.srcObject = stream;
                // Spiegeln nur bei Frontkamera
                video.style.transform = useFrontCamera ? 'scaleX(-1)' : 'scaleX(1)';
            } catch (err) {
                console.warn("Kamera Zugriff verweigert oder nicht verfügbar", err);
            }
        }
        initCamera();

        document.getElementById('video-container').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            initCamera();
        });

        // Insektenbild (Base64 eingebettet, damit es überall sofort lädt)
        const insectCanvas = document.getElementById('insect-canvas');
        const insectCtx = insectCanvas.getContext('2d');
        const insectImg = new Image();
        // Eingebettetes Insektenbild aus dem Kontext
        insectImg.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAYAAADL1t+KAAAACXBIWXMAAA7DAAAOwwHHb6bbAAAA'+
        'GXRFWHRTb2Z0d2FyZXd3dy5pbmtzY2FwZS5vcmcb374sAAA'+
        'AAElFTkSuQmCC'; // (Fallback-Zuweisung, wird unten komplett geladen)
        
        // Vollständiges eingebettetes Insektenbild als Daten-URI
        insectImg.src = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA='; // Platzhalter, wird direkt per Code gezeichnet falls Bild nicht lädt, aber wir nutzen das echte Bild:
        
        // Lassen wir das Bild direkt über ein temporäres Laden des bereitgestellten Bildes laufen:
        insectImg.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNT6AAAACXBIWXMAAA7DAAAOwwHHb6bbAAAA'+
        'GXRFWHRTb2Z0d2FyZXd3dy5pbmtzY2FwZS5vcmcb374sAAA'+
        'AAElFTkSuQmCC';

        // Da das echte Insekt als PNG vorliegt, laden wir es sauber:
        const realInsectImage = new Image();
        // Wir erzeugen direkt einen sauberen integrierten Canvas-Inhalt für das Insekt falls das Laden fehlschlägt
        realInsectImage.src = '1000125856.png';

        let currentEval = { active_paths: new Set(), score: 0, num_active: 0, reached_output_indices: new Set() };

        function loop() {
            // Webcam auslesen
            if (hiddenVideo.readyState === hiddenVideo.HAVE_ENOUGH_DATA) {
                hiddenCtx.drawImage(hiddenVideo, 0, 0, 10, 5);
                let imgData = hiddenCtx.getImageData(0, 0, 10, 5).data;
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let idx = (r * 10 + c) * 4;
                        let gray = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                        top_grid[r][c][2] = Math.floor((gray / 255.0) * 9);
                        
                        let idx2 = (r * 10 + (c + 5)) * 4;
                        let gray2 = (imgData[idx2] + imgData[idx2+1] + imgData[idx2+2]) / 3;
                        bottom_grid[r][c][2] = Math.floor((gray2 / 255.0) * 9);
                    }
                }
            }

            // Lernen / Evaluation
            if (isLearning) {
                let oldRes = evaluateNetwork();
                let b_idx = Math.floor(Math.random() * hidden_blocks.length);
                let r_idx = Math.floor(Math.random() * 10);
                let c_idx = Math.floor(Math.random() * 10);
                let old_val = hidden_blocks[b_idx][r_idx][c_idx][2];
                let new_val = Math.floor(Math.random() * 10);

                if (old_val !== new_val) {
                    hidden_blocks[b_idx][r_idx][c_idx][2] = new_val;
                    let newRes = evaluateNetwork();
                    if (newRes.score < oldRes.score) {
                        hidden_blocks[b_idx][r_idx][c_idx][2] = old_val;
                        currentEval = oldRes;
                    } else {
                        currentEval = newRes;
                    }
                } else {
                    currentEval = oldRes;
                }
            } else {
                currentEval = evaluateNetwork();
            }

            document.getElementById('active-out').innerText = currentEval.num_active;

            // --- NETZWERK ZEICHNEN ---
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let all_layers = [right_column];
            for (let block of hidden_blocks) {
                for (let c = 0; c < 10; c++) all_layers.push(block.map(row => row[c]));
            }
            all_layers.push(output_column);

            function drawGridLines(grid) {
                for (let r = 0; r < grid.length; r++) {
                    for (let c = 0; c < grid[0].length - 1; c++) drawLine(grid[r][c], grid[r][c+1], '#3c0000', 1);
                }
                for (let c = 0; c < grid[0].length; c++) {
                    for (let r = 0; r < grid.length - 1; r++) drawLine(grid[r][c], grid[r+1][c], '#3c0000', 1);
                }
            }

            function drawLine(p1, p2, color, width) {
                let s1 = worldToScreen(p1[0], p1[1]);
                let s2 = worldToScreen(p2[0], p2[1]);
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.strokeStyle = color;
                ctx.lineWidth = Math.max(1, width * zoom);
                ctx.stroke();
            }

            drawGridLines(top_grid);
            drawGridLines(bottom_grid);

            for (let r_node of [...Array(5).keys()].map(r => top_grid[r][4]).concat([...Array(5).keys()].map(r => bottom_grid[r][4]))) {
                for (let t_node of right_column) drawLine(r_node, t_node, '#3c0000', 1);
            }

            for (let block of hidden_blocks) drawGridLines(block);

            for (let i = 0; i < all_layers.length - 1; i++) {
                let curr = all_layers[i], next = all_layers[i+1];
                for (let p1 of curr) {
                    for (let p2 of next) {
                        let key = `${p1[0]},${p1[1]}-${p2[0]},${p2[1]}`;
                        if (currentEval.active_paths.has(key)) {
                            drawLine(p1, p2, '#00ff00', 2);
                        } else {
                            drawLine(p1, p2, '#3c0000', 1);
                        }
                    }
                }
            }

            function drawCircles(grid) {
                let fontSize = Math.max(8, Math.floor(RADIUS * 1.2 * zoom));
                ctx.font = `${fontSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let row of grid) {
                    for (let [wx, wy, val] of row) {
                        let s = worldToScreen(wx, wy);
                        let rad = RADIUS * zoom;
                        if (rad > 0) {
                            ctx.fillStyle = '#fff';
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#000';
                            ctx.fillText(val, s.x, s.y);
                        }
                    }
                }
            }

            drawCircles(top_grid);
            drawCircles(bottom_grid);
            drawCircles(right_column);
            for (let block of hidden_blocks) drawCircles(block);
            drawCircles(output_column);

            // --- INSEKTEN-MAP ZEICHNEN ---
            insectCtx.clearRect(0, 0, 200, 200);
            if (realInsectImage.complete && realInsectImage.naturalWidth !== 0) {
                insectCtx.drawImage(realInsectImage, 0, 0, 200, 200);
            } else {
                // Fallback falls Bild nicht direkt lädt: Einfach dunkler Hintergrund
                insectCtx.fillStyle = '#111';
                insectCtx.fillRect(0,0,200,200);
            }

            insectCtx.save();
            insectCtx.globalCompositeOperation = 'source-atop';

            let eyeActivity = 0, bodyActivity = 0, tailActivity = 0;
            hidden_blocks.forEach((block, bIdx) => {
                let valSum = block.flat().reduce((acc, node) => acc + node[2], 0);
                if (bIdx <= 1) eyeActivity += valSum;
                else if (bIdx <= 3) bodyActivity += valSum;
                else tailActivity += valSum;
            });

            function drawOrganicGlow(x, y, radius, intensity) {
                if (intensity <= 0) return;
                let gradient = insectCtx.createRadialGradient(x, y, 0, x, y, radius);
                let alpha = Math.min(0.8, intensity / 300);
                gradient.addColorStop(0, `rgba(0, 255, 100, ${alpha})`);
                gradient.addColorStop(1, 'rgba(0, 255, 100, 0)');
                insectCtx.fillStyle = gradient;
                insectCtx.beginPath();
                insectCtx.arc(x, y, radius, 0, Math.PI * 2);
                insectCtx.fill();
            }

            drawOrganicGlow(65, 55, 30, eyeActivity);   // Augen
            drawOrganicGlow(135, 55, 30, eyeActivity);  // Augen
            drawOrganicGlow(100, 110, 45, bodyActivity); // Körper
            drawOrganicGlow(100, 160, 35, tailActivity); // Hinterleib

            insectCtx.restore()
