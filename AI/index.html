<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Neural Network - Bug Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">Lernen: AN | Aktive Outputs: <span id="output-count">0</span></div>
    <video id="webcam" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const videoElement = document.getElementById('webcam');
const outputCountSpan = document.getElementById('output-count');

let WIDTH = window.innerWidth;
let HEIGHT = window.innerHeight;
canvas.width = WIDTH;
canvas.height = HEIGHT;

window.addEventListener('resize', () => {
    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
});

// Perfekter initialer Zoom & Zentrierung für den Käfer
let zoom = Math.min(WIDTH, HEIGHT) / 750;
let camera_x = 0;
let camera_y = 0;
let is_learning = true;

// Touch / Maus Steuerung zum Verschieben & Zoomen
let isDragging = false;
let lastX = 0, lastY = 0;
let initialDist = null;

canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    let dx = e.clientX - lastX;
    let dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    camera_x -= dx / zoom;
    camera_y -= dy / zoom;
});

canvas.addEventListener('pointerup', () => isDragging = false);
canvas.addEventListener('pointercancel', () => isDragging = false);

canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        initialDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
});

canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialDist !== null) {
        let currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        let factor = currentDist / initialDist;
        zoom = Math.max(0.1, Math.min(zoom * factor, 5.0));
        initialDist = currentDist;
    }
});

// Käfer-Hintergrundbild laden[span_0](start_span)[span_0](end_span)
const bugImg = new Image();
bugImg.src = '1000125857.png'; 
let bugLoaded = false;
bugImg.onload = () => { bugLoaded = true; };

// Webcam initialisieren (Rückkamera)
navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'environment' }, 
    audio: false 
}).then(stream => {
    videoElement.srcObject = stream;
    videoElement.play();
}).catch(err => {
    console.warn("Kamerazugriff fehlgeschlagen:", err);
});

const offscreenCanvas = document.createElement('canvas');
offscreenCanvas.width = 10;
offscreenCanvas.height = 5;
const offCtx = offscreenCanvas.getContext('2d');

const SPACING = 24;
const RADIUS = 6;

function world_to_screen(wx, wy) {
    return {
        x: (wx - camera_x) * zoom + WIDTH / 2,
        y: (wy - camera_y) * zoom + HEIGHT / 2
    };
}

function get_grid_positions(start_x, start_y, rows, cols, random_vals = false) {
    let positions = [];
    for (let r = 0; r < rows; r++) {
        let row_pos = [];
        for (let c = 0; c < cols; c++) {
            let wx = start_x + c * SPACING;
            let wy = start_y + r * SPACING;
            let val = random_vals ? Math.floor(Math.random() * 10) : 0;
            row_pos.push([wx, wy, val]);
        }
        positions.push(row_pos);
    }
    return positions;
}

// --- EXAKTE ANPASSUNG AN DIE KÄFER-ANATOMIE ---
// Augen liegen links (Input Grids)
let top_start_x = -320;
let top_start_y = -85;
let bottom_start_y = 15;

let top_grid = get_grid_positions(top_start_x, top_start_y, 5, 5, false);
let bottom_grid = get_grid_positions(top_start_x, bottom_start_y, 5, 5, false);

let right_start_x = top_start_x + (5 * SPACING) + 20;
let right_start_y = -55;

let right_column = [];
for (let i = 0; i < 10; i++) {
    right_column.push([right_start_x, right_start_y + i * SPACING, i]);
}

// Körper (Hidden Layers im Rumpf des Käfers)
let hidden_blocks = [];
let hidden_start_x = right_start_x + 35;
let hidden_block_width = 9 * SPACING;
let hidden_gap = 25;
let hidden_start_y = -108;

for (let b = 0; b < 5; b++) {
    let bx = hidden_start_x + b * (hidden_block_width + hidden_gap);
    hidden_blocks.push(get_grid_positions(bx, hidden_start_y, 10, 10, true));
}

// Hintern (Output Layer am rechten Ende des Käfers)
let last_block_end_x = hidden_blocks[4][0][9][0];
let output_start_x = last_block_end_x + 35;
let output_start_y = -35;
let output_labels = ["Y", "X", "Z", "-Y", "-X", "-Z"];

let output_column = [];
for (let i = 0; i < 6; i++) {
    output_column.push([output_start_x, output_start_y + i * SPACING, output_labels[i]]);
}

function evaluate_network() {
    let all_vertical_layers = [right_column];
    hidden_blocks.forEach(block => {
        for (let c = 0; c < 10; c++) {
            let col_nodes = [];
            for (let r = 0; r < 10; r++) col_nodes.push(block[r][c]);
            all_vertical_layers.push(col_nodes);
        }
    });
    all_vertical_layers.push(output_column);

    let active_paths = new Set();
    let top_right_col = [];
    let bottom_right_col = [];
    for(let r=0; r<5; r++) {
        top_right_col.push(top_grid[r][4]);
        bottom_right_col.push(bottom_grid[r][4]);
    }
    let start_nodes = top_right_col.concat(bottom_right_col);

    let max_layer_reached = 0;
    let reached_output_indices = new Set();

    start_nodes.forEach(start_node => {
        let target_val = start_node[2];
        let current_layer_nodes = [];
        let local_initial_paths = [];

        right_column.forEach(r_node => {
            if (r_node[2] === target_val) {
                local_initial_paths.push(JSON.stringify([start_node, r_node]));
                if (!current_layer_nodes.includes(r_node)) current_layer_nodes.push(r_node);
            }
        });

        if (current_layer_nodes.length === 0) return;
        local_initial_paths.forEach(p => active_paths.add(p));

        for (let i = 0; i < all_vertical_layers.length - 1; i++) {
            let next_layer = all_vertical_layers[i+1];
            let next_layer_valid = [];
            let local_paths = [];
            let is_output_step = (i === all_vertical_layers.length - 2);

            current_layer_nodes.forEach(p1 => {
                next_layer.forEach(p2 => {
                    if (is_output_step || p2[2] === target_val) {
                        local_paths.push(JSON.stringify([p1, p2]));
                        if (!next_layer_valid.includes(p2)) next_layer_valid.push(p2);
                    }
                });
            });

            if (next_layer_valid.length === 0) break;
            max_layer_reached = Math.max(max_layer_reached, i + 1);

            if (is_output_step) {
                next_layer_valid.forEach(p2 => {
                    let idx = output_column.indexOf(p2);
                    if (idx !== -1) reached_output_indices.add(idx);
                });
            }

            local_paths.forEach(p => active_paths.add(p));
            current_layer_nodes = next_layer_valid;
        }
    });

    let num_active_outputs = reached_output_indices.size;
    let score = max_layer_reached * 50;
    if (num_active_outputs === 1) score += 200000;
    else if (num_active_outputs === 0) score -= 20000;
    else score -= num_active_outputs * 100000;

    return { active_paths, score, num_active_outputs };
}

function loop() {
    if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
        offCtx.drawImage(videoElement, 0, 0, 10, 5);
        let imgData = offCtx.getImageData(0, 0, 10, 5).data;
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                let idx = (r * 10 + c) * 4;
                let gray = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                top_grid[r][c][2] = Math.floor((gray / 255.0) * 9);
                
                let idx2 = (r * 10 + (c + 5)) * 4;
                let gray2 = (imgData[idx2] + imgData[idx2+1] + imgData[idx2+2]) / 3;
                bottom_grid[r][c][2] = Math.floor((gray2 / 255.0) * 9);
            }
        }
    }

    let evalRes = evaluate_network();
    if (is_learning) {
        let old_score = evalRes.score;
        let b_idx = Math.floor(Math.random() * hidden_blocks.length);
        let r_idx = Math.floor(Math.random() * 10);
        let c_idx = Math.floor(Math.random() * 10);
        let old_val = hidden_blocks[b_idx][r_idx][c_idx][2];
        let new_val = Math.floor(Math.random() * 10);

        if (old_val !== new_val) {
            hidden_blocks[b_idx][r_idx][c_idx][2] = new_val;
            let newEval = evaluate_network();
            if (newEval.score < old_score) {
                hidden_blocks[b_idx][r_idx][c_idx][2] = old_val;
            } else {
                evalRes = newEval;
            }
        }
    }

    outputCountSpan.innerText = evalRes.num_active_outputs;

    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // --- KÄFER-HINTERGRUND EXAKT PLATZIEREN ---
    if (bugLoaded) {
        ctx.save();
        let bugWidth = 850 * zoom;
        let bugHeight = 850 * zoom;
        let centerPos = world_to_screen(-30, 0); // Exakter Mittelpunkt des Käfers
        ctx.globalAlpha = 0.3;
        ctx.drawImage(bugImg, centerPos.x - bugWidth / 2, centerPos.y - bugHeight / 2, bugWidth, bugHeight);
        ctx.restore();
    }

    let all_vertical_layers = [right_column];
    hidden_blocks.forEach(block => {
        for (let c = 0; c < 10; c++) {
            let col_nodes = [];
            for (let r = 0; r < 10; r++) col_nodes.push(block[r][c]);
            all_vertical_layers.push(col_nodes);
        }
    });
    all_vertical_layers.push(output_column);

    function drawLine(p1, p2, color, width) {
        let s1 = world_to_screen(p1[0], p1[1]);
        let s2 = world_to_screen(p2[0], p2[1]);
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, width * zoom);
        ctx.stroke();
    }

    function drawGridLines(grid) {
        let rows = grid.length;
        let cols = grid[0].length;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols - 1; c++) drawLine(grid[r][c], grid[r][c+1], "#3c0000", 1);
        }
        for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows - 1; r++) drawLine(grid[r][c], grid[r+1][c], "#3c0000", 1);
        }
    }

    drawGridLines(top_grid);
    drawGridLines(bottom_grid);
    hidden_blocks.forEach(block => drawGridLines(block));

    for (let i = 0; i < all_vertical_layers.length - 1; i++) {
        let curr = all_vertical_layers[i];
        let next = all_vertical_layers[i+1];
        curr.forEach(p1 => {
            next.forEach(p2 => {
                let key = JSON.stringify([p1, p2]);
                if (evalRes.active_paths.has(key)) {
                    drawLine(p1, p2, "#00ff00", 2);
                } else {
                    drawLine(p1, p2, "#3c0000", 1);
                }
            });
        });
    }

    function drawCircles(grid) {
        let fontSize = Math.max(7, Math.floor(RADIUS * 1.3 * zoom));
        ctx.font = `${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        grid.forEach(row => {
            row.forEach(node => {
                let s = world_to_screen(node[0], node[1]);
                let r = RADIUS * zoom;
                if (r > 0) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, r, 0, 2 * Math.PI);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.fillStyle = "#000000";
                    ctx.fillText(node[2], s.x, s.y);
                }
            });
        });
    }

    drawCircles(top_grid);
    drawCircles(bottom_grid);
    drawCircles(right_column);
    hidden_blocks.forEach(block => drawCircles(block));
    drawCircles(output_column);

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
