<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio-Recorder (Verbessert)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 680px;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #1e293b;
    }

    .header { text-align: center; }

    .time-display {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .waveform-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background: #05070c;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    audio {
      width: 90%;
      outline: none;
    }

    .center-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .rec-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 5px solid #451a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s ease, background-color 0.2s, box-shadow 0.2s;
      outline: none;
      touch-action: none;
    }

    .rec-button:hover { background: var(--accent-red-hover); }
    .rec-button.recording {
      transform: scale(0.92);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.8);
    }

    .rec-icon {
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .rec-button.recording .rec-icon {
      border-radius: 6px;
      width: 22px;
      height: 22px;
    }

    .status-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      height: 20px;
    }

    .secondary-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      border-top: 1px solid #1e293b;
      padding-top: 16px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .text-btn:hover {
      color: var(--text-main);
      background: #1e293b;
    }

    .text-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: none;
    }

    .text-btn.export { color: var(--accent-blue); }
    .text-btn.export:hover {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="time-display" id="timeDisplay">00:00.0</div>
      <div class="hint" id="hintText">Gedrückt halten zum Aufnehmen</div>
    </div>

    <div class="waveform-wrapper">
      <audio id="audioPlayer" controls style="display:none;"></audio>
      <div id="noAudioHint" style="color: var(--text-muted); font-size: 0.85rem;">Keine Aufnahme vorhanden</div>
    </div>

    <div class="center-section">
      <button class="rec-button" id="recBtn">
        <div class="rec-icon"></div>
      </button>
      <div class="status-text" id="statusText">Bereit</div>
      
      <div class="secondary-controls">
        <button class="text-btn export" id="exportBtn" disabled>💾 Speichern</button>
        <button class="text-btn" id="clearBtn" disabled>🗑️ Löschen</button>
      </div>
    </div>
  </div>

  <script>
    let mediaRecorder = null;
    let audioStream = null;
    let recordedChunks = [];
    let audioBlob = null;
    let audioUrl = null;
    let timerInterval = null;
    let startTime = 0;

    const recBtn = document.getElementById('recBtn');
    const statusText = document.getElementById('statusText');
    const hintText = document.getElementById('hintText');
    const timeDisplay = document.getElementById('timeDisplay');
    const audioPlayer = document.getElementById('audioPlayer');
    const noAudioHint = document.getElementById('noAudioHint');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    async function startRecording() {
      try {
        // Stream gezielt anfordern
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          // Stream/Mikrofon SOFORT komplett freigeben!
          if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
          }

          if (recordedChunks.length > 0) {
            audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            audioUrl = URL.createObjectURL(audioBlob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.style.display = 'block';
            noAudioHint.style.display = 'none';
            exportBtn.disabled = false;
            clearBtn.disabled = false;
            statusText.textContent = 'Aufnahme gespeichert';
          }
        };

        mediaRecorder.start();
        recBtn.classList.add('recording');
        statusText.textContent = 'Aufnahme läuft…';
        hintText.textContent = 'Loslassen zum Beenden';

        // Timer starten
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 100);

      } catch (err) {
        console.error("Mikrofon-Zugriff verweigert oder blockiert:", err);
        statusText.textContent = 'Zugriff blockiert!';
        alert('Mikrofon-Zugriff nicht möglich. Bitte Prüfen Sie die Browser-Berechtigungen.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval);
      recBtn.classList.remove('recording');
      hintText.textContent = 'Gedrückt halten zum Aufnehmen';
    }

    function updateTimer() {
      const elapsed = (Date.now() - startTime) / 1000;
      const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
      const ms = Math.floor((elapsed % 1) * 10);
      timeDisplay.textContent = `${m}:${s}.${ms}`;
    }

    // Event-Listener für zuverlässiges Halten & Loslassen
    let isPressed = false;

    recBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isPressed) return;
      isPressed = true;
      try { recBtn.setPointerCapture(e.pointerId); } catch (_) {}
      startRecording();
    });

    const handleRelease = (e) => {
      if (!isPressed) return;
      isPressed = false;
      stopRecording();
    };

    recBtn.addEventListener('pointerup', handleRelease);
    recBtn.addEventListener('pointercancel', handleRelease);
    recBtn.addEventListener('lostpointercapture', handleRelease);
    window.addEventListener('blur', handleRelease);

    // Exportieren (.webm / .ogg)
    exportBtn.addEventListener('click', () => {
      if (!audioBlob) return;
      const a = document.createElement('a');
      a.href = audioUrl;
      a.download = 'Aufnahme.webm';
      a.click();
    });

    // Löschen
    clearBtn.addEventListener('click', () => {
      if (!confirm('Aufnahme wirklich löschen?')) return;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioBlob = null;
      audioUrl = null;
      audioPlayer.src = '';
      audioPlayer.style.display = 'none';
      noAudioHint.style.display = 'block';
      exportBtn.disabled = true;
      clearBtn.disabled = true;
      timeDisplay.textContent = '00:00.0';
      statusText.textContent = 'Bereit';
    });
  </script>
</body>
</html>
