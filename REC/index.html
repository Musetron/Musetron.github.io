<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio-Recorder</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 680px;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #1e293b;
    }

    .header {
      text-align: center;
    }

    .time-display {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .waveform-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background: #05070c;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #1e293b;
      cursor: grab;
      touch-action: none;
    }

    .waveform-wrapper:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .center-needle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: var(--accent-red);
      pointer-events: none;
      box-shadow: 0 0 10px var(--accent-red);
      z-index: 5;
    }

    .center-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .rec-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--accent-red);
      border: 5px solid #451a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s ease, background-color 0.2s, box-shadow 0.2s;
      outline: none;
      touch-action: none;
    }

    .rec-button:hover {
      background: var(--accent-red-hover);
    }

    .rec-button:active, .rec-button.recording {
      transform: scale(0.92);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.8);
    }

    .rec-icon {
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
      transition: border-radius 0.2s, width 0.2s, height 0.2s;
    }

    .rec-button.recording .rec-icon {
      border-radius: 6px;
      width: 22px;
      height: 22px;
    }

    .status-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      height: 20px;
    }

    .secondary-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      border-top: 1px solid #1e293b;
      padding-top: 16px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .text-btn:hover {
      color: var(--text-main);
      background: #1e293b;
    }

    .text-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: none;
    }

    .text-btn.export {
      color: var(--accent-blue);
    }
    .text-btn.export:hover {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="time-display" id="timeDisplay">00:00.0</div>
      <div class="hint" id="hintText">Gedrückt halten zum Aufnehmen</div>
    </div>

    <div class="waveform-wrapper" id="waveWrapper">
      <div class="center-needle"></div>
      <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="center-section">
      <button class="rec-button" id="recBtn">
        <div class="rec-icon"></div>
      </button>
      <div class="status-text" id="statusText">Bereit</div>
      
      <div class="secondary-controls">
        <button class="text-btn" id="playBtn" disabled>▶ Abspielen</button>
        <button class="text-btn export" id="exportBtn" disabled>💾 Speichern</button>
        <button class="text-btn" id="clearBtn" disabled>🗑️ Löschen</button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx;
    let micStream;
    let micSource;
    let processorNode;

    const CHUNK_SIZE = 131072;
    let audioChunks = [new Float32Array(CHUNK_SIZE)];
    let totalSamples = 0;
    let sampleRate = 44100; 
    let currentWriteSample = 0;
    let db = null;
    let dbReady = false;
    let restorePromise = null;

    let isRecording = false;
    let isPlaying = false;
    let playheadSample = 0;
    let activeSourceNodes = [];
    let playStartTime = 0;
    let playOffsetSec = 0;
    let isDraggingWave = false;

    const specCanvas = document.createElement('canvas');
    const specCtx = specCanvas.getContext('2d', { willReadFrequently: true });
    let lastRenderedCol = 0;
    const hopSize = 128; 
    const numBins = 96;  

    const recBtn = document.getElementById('recBtn');
    const waveWrapper = document.getElementById('waveWrapper');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');
    const hintText = document.getElementById('hintText');
    const statusText = document.getElementById('statusText');
    const playBtn = document.getElementById('playBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    function resizeCanvas() {
      canvas.width = Math.max(1, Math.round(waveWrapper.clientWidth * window.devicePixelRatio));
      canvas.height = Math.max(1, Math.round(waveWrapper.clientHeight * window.devicePixelRatio));
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getSample(index) {
      if (index < 0 || index >= totalSamples) return 0;
      const chunkIdx = Math.floor(index / CHUNK_SIZE);
      const innerIdx = index % CHUNK_SIZE;
      return audioChunks[chunkIdx]?.[innerIdx] || 0;
    }

    function setSample(index, value) {
      const chunkIdx = Math.floor(index / CHUNK_SIZE);
      while (audioChunks.length <= chunkIdx) audioChunks.push(new Float32Array(CHUNK_SIZE));
      audioChunks[chunkIdx][index % CHUNK_SIZE] = value;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB nicht verfügbar'));
        const request = indexedDB.open('AudioRecorderFinalV3', 1);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains('segments')) database.createObjectStore('segments', { keyPath: 'start' });
          if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta', { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function loadSavedAudio() {
      try {
        db = await openDatabase();
        const all = await new Promise((resolve, reject) => {
          const tx = db.transaction(['segments', 'meta'], 'readonly');
          const segmentsReq = tx.objectStore('segments').getAll();
          const metaReq = tx.objectStore('meta').get('recording');
          tx.oncomplete = () => resolve({ segments: segmentsReq.result || [], meta: metaReq.result || null });
          tx.onerror = () => reject(tx.error);
        });
        
        if (all.meta) {
          if (Number.isFinite(all.meta.sampleRate)) sampleRate = all.meta.sampleRate;
          if (Number.isFinite(all.meta.totalSamples)) totalSamples = all.meta.totalSamples;
        }

        audioChunks = [new Float32Array(CHUNK_SIZE)];
        currentWriteSample = 0;
        
        if (all.segments && all.segments.length > 0) {
          all.segments.sort((a, b) => a.start - b.start);
          for (const segment of all.segments) {
            const values = new Float32Array(segment.data);
            for (let i = 0; i < values.length; i++) setSample(segment.start + i, values[i]);
            totalSamples = Math.max(totalSamples, segment.start + values.length);
          }
          currentWriteSample = totalSamples;
          playheadSample = totalSamples;
          buildFullSpectrogram();
          statusText.textContent = 'Bereit';
        } else {
          statusText.textContent = 'Bereit';
        }
        updateButtons();
      } catch (err) {
        statusText.textContent = 'Bereit';
      } finally {
        dbReady = true;
      }
    }

    function saveAllData() {
      if (!db || totalSamples === 0) return;
      const tx = db.transaction(['segments', 'meta'], 'readwrite');
      const store = tx.objectStore('segments');
      store.clear();
      const segSize = 32768;
      for (let i = 0; i < totalSamples; i += segSize) {
        const len = Math.min(segSize, totalSamples - i);
        const chunkData = new Float32Array(len);
        for (let j = 0; j < len; j++) chunkData[j] = getSample(i + j);
        store.put({ start: i, data: chunkData.buffer });
      }
      tx.objectStore('meta').put({ id: 'recording', totalSamples, sampleRate });
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        if (totalSamples === 0) sampleRate = audioCtx.sampleRate;
      }
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (!micStream) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ 
          	audio: { 
          		channelCount: 1,
          		echoCancellation: true,
          		noiseSuppression: true,
          		autoGainControl: true
          	} 
          });
          sampleRate = audioCtx.sampleRate;
          micSource = audioCtx.createMediaStreamSource(micStream);
          
          processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
          processorNode.onaudioprocess = (e) => {
            if (!isRecording) return;
            const input = e.inputBuffer.getChannelData(0);
            for (let i = 0; i < input.length; i++) {
              setSample(currentWriteSample, input[i]);
              currentWriteSample++;
            }
            totalSamples = Math.max(totalSamples, currentWriteSample);
            if (!isDraggingWave) playheadSample = currentWriteSample;
            
            updateLiveSpectrogram();
            updateButtons();
          };
          
          micSource.connect(processorNode);
          const nullGain = audioCtx.createGain();
          nullGain.gain.value = 0;
          processorNode.connect(nullGain);
          nullGain.connect(audioCtx.destination);
        } catch (err) {
          micStream = null;
          alert('Mikrofon-Zugriff nicht möglich.');
          throw err;
        }
      }
    }

    async function startRecording() {
      if (isRecording) return;
      if (isPlaying) stopPlayback();
      try {
        statusText.textContent = 'Mikrofon startet…';
        await initAudio();
        if (!dbReady) await (restorePromise || (restorePromise = loadSavedAudio()));
        
        currentWriteSample = playheadSample;
        isRecording = true;
        recBtn.classList.add('recording');
        hintText.textContent = 'Loslassen zum Pausieren';
        statusText.textContent = 'Aufnahme läuft…';
      } catch (err) {
        isRecording = false;
        recBtn.classList.remove('recording');
        hintText.textContent = 'Gedrückt halten zum Aufnehmen';
        statusText.textContent = 'Bereit';
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      recBtn.classList.remove('recording');
      hintText.textContent = 'Gedrückt halten zum Aufnehmen';
      statusText.textContent = 'Pausiert';
      
      totalSamples = Math.max(totalSamples, currentWriteSample);
      buildFullSpectrogram();
      saveAllData();
      updateButtons();
    }

    let recPointerDown = false;
    recBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (recPointerDown) return;
      recPointerDown = true;
      try { recBtn.setPointerCapture(e.pointerId); } catch (_) {}
      startRecording();
    });
    const releaseRecordPointer = () => {
      if (!recPointerDown) return;
      recPointerDown = false;
      stopRecording();
    };
    recBtn.addEventListener('pointerup', releaseRecordPointer);
    recBtn.addEventListener('pointercancel', releaseRecordPointer);
    recBtn.addEventListener('lostpointercapture', releaseRecordPointer);
    window.addEventListener('blur', releaseRecordPointer);

    function getHeatmapColor(val) {
      val = Math.max(0, Math.min(1, val));
      let r = 0, g = 0, b = 0;
      if (val < 0.2) {
        const t = val * 5;
        b = Math.floor(t * 200);
      } else if (val < 0.45) {
        const t = (val - 0.2) * 4;
        b = 200;
        g = Math.floor(t * 220);
      } else if (val < 0.7) {
        const t = (val - 0.45) * 4;
        r = Math.floor(t * 255);
        g = 220 + Math.floor(t * 35);
        b = Math.floor((1 - t) * 200);
      } else {
        const t = (val - 0.7) * 3.33;
        r = 255;
        g = 255 - Math.floor(t * 100);
        b = Math.floor(t * 50);
      }
      return [r, g, b];
    }

    function getFrequencyMagnitude(centerSample, freqNorm, windowSize = 32) {
      let real = 0, imag = 0;
      const halfWin = Math.floor(windowSize / 2);
      const start = centerSample - halfWin;
      
      for (let i = 0; i < windowSize; i++) {
        const sIdx = start + i;
        const sampleVal = (sIdx >= 0 && sIdx < totalSamples) ? getSample(sIdx) : 0;
        const win = 0.5 * (1 - Math.cos(2 * Math.PI * i / windowSize));
        const angle = 2 * Math.PI * freqNorm * i;
        real += sampleVal * win * Math.cos(angle);
        imag -= sampleVal * win * Math.sin(angle);
      }
      const mag = Math.sqrt(real * real + imag * imag) / windowSize;
      return Math.min(1, mag * 22);
    }

    function updateLiveSpectrogram() {
      const targetCols = Math.ceil(totalSamples / hopSize);
      if (targetCols <= lastRenderedCol) return;

      if (specCanvas.height !== numBins || specCanvas.width < targetCols) {
        const oldWidth = specCanvas.width || targetCols;
        const oldHeight = specCanvas.height || numBins;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = oldWidth;
        tempCanvas.height = oldHeight;
        tempCanvas.getContext('2d').drawImage(specCanvas, 0, 0);

        specCanvas.width = Math.max(oldWidth, targetCols);
        specCanvas.height = numBins;
        specCtx.fillStyle = '#05070c';
        specCtx.fillRect(0, 0, specCanvas.width, specCanvas.height);
        specCtx.drawImage(tempCanvas, 0, 0);
      }

      for (let c = lastRenderedCol; c < targetCols; c++) {
        const centerSample = c * hopSize;
        for (let b = 0; b < numBins; b++) {
          const freqNorm = ((numBins - 1 - b) / numBins) * 0.48;
          const mag = getFrequencyMagnitude(centerSample, freqNorm, 32);
          const rgb = getHeatmapColor(mag);
          specCtx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
          specCtx.fillRect(c, b, 1, 1);
        }
      }
      lastRenderedCol = targetCols;
    }

    function buildFullSpectrogram() {
      if (totalSamples === 0) return;
      const numCols = Math.ceil(totalSamples / hopSize);
      specCanvas.width = numCols;
      specCanvas.height = numBins;
      
      const imgData = specCtx.createImageData(numCols, numBins);
      const pixels = imgData.data;

      for (let c = 0; c < numCols; c++) {
        const centerSample = c * hopSize;
        for (let b = 0; b < numBins; b++) {
          const freqNorm = ((numBins - 1 - b) / numBins) * 0.48;
          const mag = getFrequencyMagnitude(centerSample, freqNorm, 32);
          const rgb = getHeatmapColor(mag);
          
          const idx = (b * numCols + c) * 4;
          pixels[idx]     = rgb[0];
          pixels[idx + 1] = rgb[1];
          pixels[idx + 2] = rgb[2];
          pixels[idx + 3] = 255;
        }
      }
      specCtx.putImageData(imgData, 0, 0);
      lastRenderedCol = numCols;
    }

    function draw() {
      requestAnimationFrame(draw);
      
      if (isRecording) {
        playheadSample = currentWriteSample;
      } else if (isPlaying && audioCtx) {
        const elapsed = audioCtx.currentTime - playStartTime;
        const currentSec = playOffsetSec + elapsed;
        playheadSample = Math.min(totalSamples, Math.floor(currentSec * sampleRate));
        if (playheadSample >= totalSamples) stopPlayback();
      }
      
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, w, h);

      if (totalSamples === 0) {
        timeDisplay.textContent = '00:00.0';
        return;
      }

      const samplesOnScreen = sampleRate * 4;
      const startSample = playheadSample - Math.floor(samplesOnScreen / 2);
      const endSample = playheadSample + Math.floor(samplesOnScreen / 2);

      const startCol = startSample / hopSize;
      const endCol = endSample / hopSize;
      const colSpan = endCol - startCol;

      try {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(
          specCanvas,
          Math.round(startCol), 0, Math.max(1, Math.round(colSpan)), numBins,
          0, 0, w, h
        );

        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        for (let y = 0; y < h; y += 4) {
          ctx.fillRect(0, y, w, 1);
        }
      } catch (err) {}

      const currentSec = playheadSample / sampleRate;
      const m = Math.floor(currentSec / 60).toString().padStart(2, '0');
      const s = Math.floor(currentSec % 60).toString().padStart(2, '0');
      const ms = Math.floor((currentSec % 1) * 10);
      timeDisplay.textContent = `${m}:${s}.${ms}`;
    }
    draw();

    let dragStartX = 0;
    let dragStartSample = 0;
    waveWrapper.addEventListener('pointerdown', (e) => {
      if (totalSamples === 0) return;
      if (isPlaying) stopPlayback();
      isDraggingWave = true;
      dragStartX = e.clientX;
      dragStartSample = playheadSample;
      try { waveWrapper.setPointerCapture(e.pointerId); } catch (_) {}
    });
    
    waveWrapper.addEventListener('pointermove', (e) => {
      if (!isDraggingWave) return;
      const dx = e.clientX - dragStartX;
      const samplesOnScreen = sampleRate * 4;
      const pxPerSample = waveWrapper.clientWidth / samplesOnScreen;
      const sampleDelta = Math.round(-dx / pxPerSample);
      playheadSample = Math.max(0, Math.min(totalSamples, dragStartSample + sampleDelta));
    });
    
    const endWaveDry = () => { isDraggingWave = false; };
    waveWrapper.addEventListener('pointerup', endWaveDry);
    waveWrapper.addEventListener('pointercancel', endWaveDry);
    waveWrapper.addEventListener('lostpointercapture', endWaveDry);

    function createReverbImpulse(ctx, duration = 0.6, decay = 3.0) {
      const rate = ctx.sampleRate;
      const length = rate * duration;
      const impulse = ctx.createBuffer(2, length, rate);
      const left = impulse.getChannelData(0);
      const right = impulse.getChannelData(1);
      for (let i = 0; i < length; i++) {
        const n = Math.random() * 2 - 1;
        left[i] = n * Math.pow(1 - i / length, decay);
        right[i] = n * Math.pow(1 - i / length, decay);
      }
      return impulse;
    }

    async function startPlayback() {
      if (totalSamples === 0 || isRecording) return;
      try {
        await initAudio();
        if (playheadSample >= totalSamples) playheadSample = 0;
        
        const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < totalSamples; i++) channelData[i] = getSample(i);
        
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;

        const phoneFilter = audioCtx.createBiquadFilter();
        phoneFilter.type = 'bandpass';
        phoneFilter.frequency.setValueAtTime(1400, audioCtx.currentTime);
        phoneFilter.Q.setValueAtTime(0.7, audioCtx.currentTime);

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(12, audioCtx.currentTime);

        const makeupGain = audioCtx.createGain();
        makeupGain.gain.value = 2.0; 

        const convolver = audioCtx.createConvolver();
        convolver.buffer = createReverbImpulse(audioCtx, 0.6, 3.0);

        const dryGain = audioCtx.createGain();
        dryGain.gain.value = 0.9;
        const wetGain = audioCtx.createGain();
        wetGain.gain.value = 0.12;

        source.connect(phoneFilter);
        phoneFilter.connect(compressor);
        compressor.connect(makeupGain);

        makeupGain.connect(dryGain);
        dryGain.connect(audioCtx.destination);

        makeupGain.connect(convolver);
        convolver.connect(wetGain);
        wetGain.connect(audioCtx.destination);

        activeSourceNodes = [source];

        playOffsetSec = playheadSample / sampleRate;
        playStartTime = audioCtx.currentTime;
        source.start(0, playOffsetSec);

        source.onended = () => {
          if (isPlaying) stopPlayback();
        };

        isPlaying = true;
        playBtn.textContent = '⏸ Pausieren';
        statusText.textContent = 'Wiedergabe aktiv…';
      } catch (err) {
        console.error(err);
        statusText.textContent = 'Wiedergabe nicht möglich';
      }
    }

    function stopPlayback() {
      if (!isPlaying) return;
      activeSourceNodes.forEach(src => {
        try { src.stop(); } catch (_) {}
      });
      activeSourceNodes = [];
      isPlaying = false;
      playBtn.textContent = '▶ Abspielen';
      statusText.textContent = 'Pausiert';
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    exportBtn.addEventListener('click', async () => {
      if (totalSamples === 0 || isRecording) return;
      if (isPlaying) stopPlayback();
      statusText.textContent = 'Rendere .ogg Datei…';
      exportBtn.disabled = true;
      try {
        const offlineCtx = new OfflineAudioContext(1, totalSamples + sampleRate * 0.4, sampleRate);
        const buffer = offlineCtx.createBuffer(1, totalSamples, sampleRate);
        const channelData = buffer.getChannelData(0);
        for (let i = 0; i < totalSamples; i++) channelData[i] = getSample(i);
        
        const source = offlineCtx.createBufferSource();
        source.buffer = buffer;

        const phoneFilter = offlineCtx.createBiquadFilter();
        phoneFilter.type = 'bandpass';
        phoneFilter.frequency.setValueAtTime(1400, 0);
        phoneFilter.Q.setValueAtTime(0.7, 0);

        const compressor = offlineCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-24, 0);
        compressor.ratio.setValueAtTime(12, 0);

        const makeupGain = offlineCtx.createGain();
        makeupGain.gain.value = 2.0;

        const convolver = offlineCtx.createConvolver();
        convolver.buffer = createReverbImpulse(offlineCtx, 0.6, 3.0);

        const dryGain = offlineCtx.createGain();
        dryGain.gain.value = 0.9;
        const wetGain = offlineCtx.createGain();
        wetGain.gain.value = 0.12;

        source.connect(phoneFilter);
        phoneFilter.connect(compressor);
        compressor.connect(makeupGain);
        
        makeupGain.connect(dryGain);
        dryGain.connect(offlineCtx.destination);

        makeupGain.connect(convolver);
        convolver.connect(wetGain);
        wetGain.connect(offlineCtx.destination);

        source.start(0);
        const renderedBuffer = await offlineCtx.startRendering();
        
        const streamDest = audioCtx.createMediaStreamDestination();
        const liveSource = audioCtx.createBufferSource();
        liveSource.buffer = renderedBuffer;
        liveSource.connect(streamDest);
        
        const options = { mimeType: 'audio/ogg;codecs=opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          options.mimeType = 'audio/webm;codecs=opus';
        }

        const recorder = new MediaRecorder(streamDest.stream, options);
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/ogg' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = 'Aufnahme.ogg';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
          statusText.textContent = 'Blitzschnell als .ogg exportiert!';
          exportBtn.disabled = false;
          streamDest.stream.getTracks().forEach(track => track.stop());
        };
        recorder.onerror = () => {
          statusText.textContent = 'Fehler beim Export';
          exportBtn.disabled = false;
          streamDest.stream.getTracks().forEach(track => track.stop());
        };
        recorder.start();
        liveSource.start(0);
        setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, ((totalSamples / sampleRate) + 0.4) * 1000 + 100);
      } catch (err) {
        console.error(err);
        statusText.textContent = 'Fehler beim Export';
        exportBtn.disabled = false;
      }
    });

    clearBtn.addEventListener('click', async () => {
      if (isRecording) return;
      if (isPlaying) stopPlayback();
      if (!confirm('Möchtest du die gesamte Aufnahme wirklich unwiderruflich löschen?')) return;
      try {
        audioChunks = [new Float32Array(CHUNK_SIZE)];
        totalSamples = 0;
        currentWriteSample = 0;
        playheadSample = 0;
        lastRenderedCol = 0;
        specCanvas.width = 0;
        specCanvas.height = 0;
        if (db) {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(['segments', 'meta'], 'readwrite');
            tx.objectStore('segments').clear();
            tx.objectStore('meta').clear();
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
          });
        }
        updateButtons();
        statusText.textContent = 'Gelöscht';
      } catch (err) {
        statusText.textContent = 'Löschen fehlgeschlagen';
      }
    });

    function updateButtons() {
      const hasData = totalSamples > 0;
      playBtn.disabled = !hasData || isRecording;
      exportBtn.disabled = !hasData || isRecording;
      clearBtn.disabled = !hasData || isRecording;
    }

    restorePromise = loadSavedAudio();
  </script>
</body>
</html>
