<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Studio - Prompt zu Video</title>
​<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
​<!-- Three.js & Loaders -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
​<!-- Reine Client-Side TTS Library (100% verlässlich ohne API/Server) -->
<script src="https://cdn.jsdelivr.net/npm/mespeak@1.9.8/mespeak.js"></script>
​<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap');
​* {
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
}
​body {
font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
background-color: #ffffff;
color: #1f2937;
overflow: hidden;
user-select: none;
height: 100vh;
width: 100vw;
}
​#canvas-container {
width: 100%;
height: 100%;
position: absolute;
top: 0;
left: 0;
z-index: 0;
}
​.glass {
background: rgba(255, 255, 255, 0.88);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(0, 0, 0, 0.08);
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
}
</style>
</head>
<body class="relative overflow-hidden w-screen h-screen select-none bg-white">
​<!-- 3D Canvas Container -->
<div id="canvas-container"></div>
​<!-- Subtitle Overlay -->
<div id="subtitle-box" class="hidden absolute top-8 left-1/2 -translate-x-1/2 z-20 glass px-6 py-3 rounded-2xl max-w-[90vw] text-center border border-gray-200 transition-all duration-300">
<span id="subtitle-speaker" class="font-extrabold text-indigo-600 block text-xs uppercase tracking-wider mb-0.5">Sprecher</span>
<p id="subtitle-text" class="text-gray-800 text-sm font-semibold">...</p>
</div>
​<!-- Recording Indicator -->
<div id="rec-badge" class="hidden absolute top-8 right-8 z-20 bg-red-600 text-white font-extrabold text-xs px-4 py-2 rounded-full flex items-center space-x-2 animate-pulse shadow-lg">
<div class="w-2.5 h-2.5 bg-white rounded-full"></div>
<span>AUFNAHME LÄUFT...</span>
</div>
​<!-- UI Prompt Control Bar -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-full max-w-2xl px-4 pointer-events-auto">
<div class="glass p-3 rounded-3xl space-y-3">
<textarea id="prompt-input" rows="3" class="w-full bg-gray-50/90 text-gray-800 text-xs sm:text-sm font-medium p-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" placeholder="Prompt eingeben, z.B.:
Musetron: ich bin da
Sister_Melanie: Hallo was geht?"></textarea>
​<div class="flex items-center justify-between gap-2">
<button id="btn-play" onclick="triggerPlaySequence(false)" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold text-xs sm:text-sm py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/20 flex items-center justify-center space-x-2 transition-all">
<i class="fa-solid fa-play"></i>
<span>PLAY VIDEO</span>
</button>
<button id="btn-render" onclick="triggerPlaySequence(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-xs sm:text-sm py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2 transition-all">
<i class="fa-solid fa-file-video"></i>
<span>RENDER VIDEO</span>
</button>
</div>
</div>
</div>
​<!-- Loading Screen -->
<div id="loader" class="absolute inset-0 z-40 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center space-y-4">
<div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
<p id="loader-text" class="text-xs font-bold text-gray-600 tracking-wider">Charaktere werden vorbereitet...</p>
</div>
​<script>
const CHARACTER_CONFIG = {
'Musetron': { scale: 1.0, url: 'https://dl.mediafire.com/file/8cuonfm38kcu7jn/Musetron.fbx/file' },
'Megtron': { scale: 1.0, url: 'https://dl.mediafire.com/file/2w7r13ff5upgpv6/Megtron.fbx/file' },
'Maschderle': { scale: 1.0, url: 'https://dl.mediafire.com/file/l5u293at8i8v1kx/Maschderle.fbx/file' },
'Lord_PoBack': { scale: 1.0, url: 'https://dl.mediafire.com/file/qv2zwomjgv8d12o/Lord_PoBack.fbx/file' },
'Sister_Melanie': { scale: 0.82, url: 'https://dl.mediafire.com/file/x5ei9p2quf7yp0m/Sister_Melanie.fbx/file' }
};
​const WALK_SPEED = 1.1;
​const characters = new Map();
let scene, camera, renderer, clock;
let activeSpeakerKey = null;
​const FIXED_CAM_POS = new THREE.Vector3(0, 2.2, 7.5);
const DEFAULT_LOOK_AT = new THREE.Vector3(0, 1.2, 0);
​let targetCamLookAt = DEFAULT_LOOK_AT.clone();
let currentCamLookAt = DEFAULT_LOOK_AT.clone();
​const DEFAULT_FOV = 40;
const ZOOM_FOV = 28;
let targetFOV = DEFAULT_FOV;
​let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
​let ttsReady = false;
​function initTTS() {
if (window.meSpeak) {
try {
meSpeak.loadConfig("https://cdn.jsdelivr.net/npm/mespeak@1.9.8/mespeak_config.json", () => {
meSpeak.loadVoice("https://cdn.jsdelivr.net/npm/mespeak@1.9.8/voices/de.json", () => {
ttsReady = true;
console.log("meSpeak TTS bereit!");
});
});
} catch(e) {
console.warn("meSpeak Init Fehler:", e);
}
}
}
​function init() {
scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
​camera = new THREE.PerspectiveCamera(DEFAULT_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.copy(FIXED_CAM_POS);
camera.lookAt(DEFAULT_LOOK_AT);
​renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
​renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
​document.getElementById('canvas-container').appendChild(renderer.domElement);
clock = new THREE.Clock();
​scene.add(new THREE.AmbientLight(0xffffff, 0.85));
​const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.position.set(6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.bias = -0.0002;
scene.add(sun);
​const rimLight = new THREE.DirectionalLight(0xa5b4fc, 0.3);
rimLight.position.set(-8, 8, -5);
scene.add(rimLight);
​const shadowPlane = new THREE.Mesh(
new THREE.PlaneGeometry(100, 100),
new THREE.ShadowMaterial({ opacity: 0.12 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = 0;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);
​window.addEventListener('resize', onWindowResize);
​initTTS();
loadAllCharacters();
animate();
}
​async function loadAllCharacters() {
const loader = new THREE.FBXLoader();
const keys = Object.keys(CHARACTER_CONFIG);
const total = keys.length;
​const spacing = 1.8;
const startX = -((total - 1) * spacing) / 2;
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
​for (let i = 0; i < keys.length; i++) {
const key = keys[i];
const config = CHARACTER_CONFIG[key];
document.getElementById('loader-text').innerText = Lade (${i + 1}/${total}): ${key}...;
​try {
const group = await loadFBX(loader, config.url);
​group.traverse((child) => {
if (child.isMesh) {
child.castShadow = child.receiveShadow = true;
if (child.material) {
const mats = Array.isArray(child.material) ? child.material : [child.material];
const cleanMats = mats.map(m => {
if (m.map) {
m.map.wrapS = THREE.ClampToEdgeWrapping;
m.map.wrapT = THREE.ClampToEdgeWrapping;
m.map.minFilter = THREE.LinearMipmapLinearFilter;
m.map.encoding = THREE.sRGBEncoding;
if (maxAnisotropy > 0) m.map.anisotropy = maxAnisotropy;
}
return new THREE.MeshStandardMaterial({
map: m.map || null,
color: m.color ? m.color.clone() : new THREE.Color(0xd1d5db),
roughness: 0.92,
metalness: 0.0,
skinning: true
});
});
child.material = Array.isArray(child.material) ? cleanMats : cleanMats[0];
}
}
});
​group.scale.set(1, 1, 1);
group.position.set(0, 0, 0);
group.updateMatrixWorld(true);
​const box = new THREE.Box3().setFromObject(group);
const size = box.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const baseScale = maxDim > 0 ? (2.15 / maxDim) * config.scale : 0.01;
group.scale.setScalar(baseScale);
​group.updateMatrixWorld(true);
const scaledBox = new THREE.Box3().setFromObject(group);
const groundY = -scaledBox.min.y;
group.position.y = groundY;
​const homeX = startX + (i * spacing);
group.position.x = homeX;
group.position.z = 0;
​const mixer = new THREE.AnimationMixer(group);
let idleAction = null;
let walkAction = null;
​if (group.animations.length > 0) {
idleAction = mixer.clipAction(group.animations[0]);
idleAction.play();
}
​scene.add(group);
​characters.set(key, {
key,
group,
mixer,
idleAction,
walkAction,
state: 'idle',
groundY: groundY,
targetPos: group.position.clone(),
homeArea: { minX: homeX - 0.6, maxX: homeX + 0.6, minZ: -0.6, maxZ: 0.6 },
nextStateChange: clock.getElapsedTime() + Math.random() * 4 + 2
});
​} catch (err) {
console.warn(Fehler beim Laden von ${key}:, err);
}
}
​document.getElementById('loader').classList.add('hidden');
}
​function loadFBX(loader, url) {
return new Promise((resolve, reject) => {
loader.load(url, resolve, undefined, reject);
});
}
​function updateCharacterBehaviors(delta, time) {
characters.forEach((char) => {
if (char.mixer) char.mixer.update(delta);
​char.group.position.y = char.groundY;
​if (activeSpeakerKey === char.key) {
if (char.state === 'walk') {
char.state = 'idle';
if (char.idleAction) {
if (char.walkAction) char.walkAction.fadeOut(0.2);
char.idleAction.reset().fadeIn(0.2).play();
}
}
char.nextStateChange = time + 3.0;
return;
}
​if (time > char.nextStateChange) {
char.nextStateChange = time + Math.random() * 5 + 3;
if (char.state === 'idle') {
char.targetPos.set(
THREE.MathUtils.randFloat(char.homeArea.minX, char.homeArea.maxX),
char.groundY,
THREE.MathUtils.randFloat(char.homeArea.minZ, char.homeArea.maxZ)
);
char.state = 'walk';
if (char.walkAction) {
if (char.idleAction) char.idleAction.fadeOut(0.2);
char.walkAction.reset().fadeIn(0.2).play();
}
} else {
char.state = 'idle';
if (char.idleAction) {
if (char.walkAction) char.walkAction.fadeOut(0.2);
char.idleAction.reset().fadeIn(0.2).play();
}
}
}
​if (char.state === 'walk') {
const dir = new THREE.Vector3().subVectors(char.targetPos, char.group.position);
dir.y = 0;
const dist = dir.length();
​if (dist > 0.05) {
dir.normalize();
const targetAngle = Math.atan2(dir.x, dir.z);
char.group.rotation.y = THREE.MathUtils.lerp(char.group.rotation.y, targetAngle, delta * 5);
​char.group.position.addScaledVector(dir, delta * WALK_SPEED);
​char.group.position.x = THREE.MathUtils.clamp(char.group.position.x, char.homeArea.minX, char.homeArea.maxX);
char.group.position.z = THREE.MathUtils.clamp(char.group.position.z, char.homeArea.minZ, char.homeArea.maxZ);
} else {
char.state = 'idle';
if (char.idleAction) {
if (char.walkAction) char.walkAction.fadeOut(0.2);
char.idleAction.reset().fadeIn(0.2).play();
}
}
}
});
}
​let sequenceIsPlaying = false;
​async function triggerPlaySequence(shouldRecord) {
if (sequenceIsPlaying) {
if (window.meSpeak) meSpeak.stop();
sequenceIsPlaying = false;
activeSpeakerKey = null;
hideSubtitle();
return;
}
​sequenceIsPlaying = true;
const playButton = document.getElementById('btn-play');
const renderButton = document.getElementById('btn-render');
playButton.disabled = renderButton.disabled = true;
​try {
if (shouldRecord) startVideoRecording();
await playPromptSequence();
} catch (err) {
console.error('Playback/TTS error:', err);
} finally {
if (shouldRecord) stopVideoRecording();
sequenceIsPlaying = false;
playButton.disabled = renderButton.disabled = false;
activeSpeakerKey = null;
}
}
​function startVideoRecording() {
recordedChunks = [];
isRecording = true;
document.getElementById('rec-badge').classList.remove('hidden');
​const stream = renderer.domElement.captureStream(60);
​let mimeType = 'video/webm';
if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mimeType = 'video/webm;codecs=vp9';
else if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';
​try {
mediaRecorder = new MediaRecorder(stream, { mimeType });
mediaRecorder.ondataavailable = (e) => {
if (e.data && e.data.size > 0) recordedChunks.push(e.data);
};
mediaRecorder.onstop = downloadVideoFile;
mediaRecorder.start(100);
} catch (e) {
console.error("Recording error:", e);
}
}
​function stopVideoRecording() {
if (mediaRecorder && isRecording) {
isRecording = false;
document.getElementById('rec-badge').classList.add('hidden');
mediaRecorder.stop();
}
}
​function downloadVideoFile() {
const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.style.display = 'none';
a.href = url;
const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
a.download = 3D_Prompt_Video_${Date.now()}.${ext};
document.body.appendChild(a);
a.click();
setTimeout(() => {
document.body.removeChild(a);
window.URL.revokeObjectURL(url);
}, 100);
}
​async function playPromptSequence() {
const promptText = document.getElementById('prompt-input').value.trim();
if (!promptText) return;
​const lines = promptText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
​for (const line of lines) {
if (!sequenceIsPlaying) break;
const parts = line.split(':');
if (parts.length >= 2) {
const rawName = parts[0].trim();
const text = parts.slice(1).join(':').trim();
​const matchedKey = findCharacterKey(rawName);
activeSpeakerKey = matchedKey;
​if (matchedKey && characters.has(matchedKey)) {
focusCameraOnSpeaker(matchedKey);
} else {
resetCameraFocus();
}
​await speakLine(rawName, text);
}
}
​activeSpeakerKey = null;
resetCameraFocus();
hideSubtitle();
}
​function findCharacterKey(nameInput) {
const cleanInput = nameInput.toLowerCase().replace(/[^a-z0-9]/g, '');
for (const key of characters.keys()) {
const cleanKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
if (cleanKey.includes(cleanInput) || cleanInput.includes(cleanKey)) {
return key;
}
}
return null;
}
​function focusCameraOnSpeaker(charKey) {
const charData = characters.get(charKey);
if (!charData) return;
​const headPos = charData.group.position.clone().add(new THREE.Vector3(0, 1.25, 0));
targetCamLookAt.copy(headPos);
targetFOV = ZOOM_FOV;
}
​function resetCameraFocus() {
targetCamLookAt.copy(DEFAULT_LOOK_AT);
targetFOV = DEFAULT_FOV;
}
​async function speakLine(speakerName, text) {
showSubtitle(speakerName, text);
​if (!text.trim()) return;
​const isFemale = speakerName.toLowerCase().includes('melanie');
​return new Promise((resolve) => {
if (ttsReady && window.meSpeak) {
meSpeak.speak(text, {
pitch: isFemale ? 65 : 35,
speed: 130,
variant: isFemale ? "f3" : "m3"
}, () => {
setTimeout(resolve, 200);
});
} else {
setTimeout(resolve, Math.max(1500, text.length * 80));
}
});
}
​function showSubtitle(speaker, text) {
document.getElementById('subtitle-speaker').innerText = speaker;
document.getElementById('subtitle-text').innerText = text;
document.getElementById('subtitle-box').classList.remove('hidden');
}
​function hideSubtitle() {
document.getElementById('subtitle-box').classList.add('hidden');
}
​function animate() {
requestAnimationFrame(animate);
​const rawDelta = clock.getDelta();
const delta = Math.min(rawDelta, 0.05);
const time = clock.getElapsedTime();
​updateCharacterBehaviors(delta, time);
​currentCamLookAt.lerp(targetCamLookAt, delta * 4.0);
camera.position.copy(FIXED_CAM_POS);
camera.lookAt(currentCamLookAt);
​if (Math.abs(camera.fov - targetFOV) > 0.01) {
camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, delta * 4.0);
camera.updateProjectionMatrix();
}
​renderer.render(scene, camera);
}
​function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
​window.onload = init;
</script>
</body>
</html>
